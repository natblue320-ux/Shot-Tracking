<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes tirs – Basket</title>
<meta name="description" content="Suivi de tirs de basket : saisie rapide, statistiques et objectifs.">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes tirs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light dark;
--bg:#f4f4f5;--surface:#fff;--surface2:#ededee;--text:#0c0c0d;--muted:#6b6b72;--line:#dedee1;--track:#e4e4e7;
--accent:#0c0c0d;--acc-text:#0c0c0d;--accent-t:#fff;--field:#fff;--zs:#ececee;--cline:#6b6b72;
--ok:#16a34a;--ko:#dc2626;--okbg:rgba(22,163,74,.2);--kobg:rgba(220,38,38,.18);--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0b;--surface:#141415;--surface2:#1d1d1f;--text:#f2f2f3;--muted:#8f8f96;--line:#2a2a2d;--track:#2a2a2d;
--accent:#f2f2f3;--acc-text:#f2f2f3;--accent-t:#0a0a0b;--field:#0f0f10;--zs:#1b1b1d;--cline:#8f8f96;
--ok:#22a85a;--ko:#e5484d;--okbg:rgba(34,168,90,.25);--kobg:rgba(229,72,77,.25);--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;color:var(--text);background:var(--bg);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
h2,h3{margin:0}
h3{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
h3:first-child{margin-top:0}
.mut{color:var(--muted)}.small{font-size:13px}
#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden;background:var(--bg)}
#main{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(var(--pt,64px) + 12px) 14px calc(var(--pb,130px) + 14px)}
#main::-webkit-scrollbar{display:none}
#topbar{position:absolute;top:0;left:0;right:0;z-index:5;padding-top:env(safe-area-inset-top);background:var(--bg);border-bottom:1px solid var(--line)}
#bottombar{position:absolute;bottom:0;left:0;right:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 18px;min-height:56px}
#hdr h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
#live{padding:8px 16px 2px}
#actions{padding:10px 12px 8px;border-bottom:1px solid var(--line)}
#nav{display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{min-height:58px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--text)}
#nav button.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--text);border-radius:0 0 2px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.btn{min-height:48px;min-width:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri,.chip.on,.seg button.on,.resume{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn.danger{color:var(--ko);border-color:var(--line)}
.btn.block{display:flex;width:100%;margin-top:10px}
.btn.xl{min-height:56px;font-size:17px;border-radius:12px}
.btn.ico{border:0;background:none;padding:0;width:48px;font-size:20px}
.btn:active,.chip:active,.scard:active{opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--track);transition:.15s}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.15s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(22px);background:var(--accent-t)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:10px 12px;font-size:17px;-webkit-user-select:text;user-select:text}
textarea{min-height:76px;resize:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{min-height:48px;border:0;border-radius:9px;background:none;font-weight:600;font-size:15px}
.seg button.on.okc{background:var(--ok);color:#fff;border-color:transparent}
.seg button.on.koc{background:var(--ko);color:#fff;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px}
.chips.scroll .chip{flex:none}
.cap{margin:8px 0 0;font-size:14px;color:var(--muted);text-align:center}
#live.f-ok{animation:fok .5s}#live.f-ko{animation:fko .5s}
@keyframes fok{0%{background:var(--okbg)}100%{background:var(--bg)}}
@keyframes fko{0%{background:var(--kobg)}100%{background:var(--bg)}}
.lv-top{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--text)}
.tag{padding:3px 8px;border-radius:6px;font-weight:700;font-size:11px;background:var(--surface2);color:var(--text);letter-spacing:.06em}
.tag.pz{background:var(--accent);color:var(--accent-t)}
.tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.lv-main{text-align:center;font-size:46px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;margin:2px 0 0;letter-spacing:-.02em}
.lv-sub{text-align:center;font-size:14px;color:var(--muted)}
.lv-sub b{color:var(--text)}
.dots{display:flex;overflow-x:auto;min-height:48px;align-items:center;scrollbar-width:none}
.dots.wrap{flex-wrap:wrap;overflow:visible}
.dot{flex:none;width:38px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.d{width:24px;height:24px;border-radius:50%;display:block;font-style:normal;font-weight:700;font-size:13px;line-height:24px;text-align:center;color:#fff}
.d.ok{background:var(--ok)}.d.ko{background:var(--ko)}
.undo{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;font-size:15px;margin-bottom:8px}
.undo:disabled{opacity:.4}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{height:clamp(88px,15vh,130px);height:clamp(88px,15dvh,130px);border:0;border-radius:16px;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.shot.ok{background:var(--ok)}.shot.ko{background:var(--ko)}
.shot:active{transform:scale(.97);filter:brightness(1.12)}
.resume{width:100%;height:clamp(88px,15vh,130px);border-radius:16px;font-size:24px;font-weight:700}
.court{display:block;width:100%;max-width:440px;margin:0 auto;border-radius:10px;background:var(--zs)}
.court .z{fill:var(--zs);stroke:var(--cline);stroke-opacity:.45;stroke-width:1}
.court .z[data-a]{cursor:pointer}
.court .z.sel{fill:var(--accent);stroke:var(--accent);stroke-opacity:1;stroke-width:2}
.court .cl{fill:none;stroke:var(--cline);stroke-width:2;pointer-events:none}
.court .cl.d{stroke-dasharray:4 4;stroke-width:1.5;opacity:.7}
.court .rim{fill:none;stroke:var(--text);stroke-width:2.5;pointer-events:none}
.court .hint{fill:var(--muted);font-size:10px;font-weight:700;text-anchor:middle;pointer-events:none}
.hl{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:2.5px;pointer-events:none}
.hl.n{font-size:9px;font-weight:600}
.leg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px}
.leg i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#dc4a4f,#7a7a80,#22a85a)}
.scard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;min-height:72px;color:var(--text);box-shadow:var(--shadow)}
.scard .l1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scard .t{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .sc{font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.scard .s{font-size:13px;color:var(--muted);margin-top:2px}
.scard.live{border-color:var(--text)}
.mh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 4px 8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:var(--text)}
.kpi b{display:block;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--muted)}
.br{margin:12px 0}
.br .t{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.br .t em{font-style:normal;color:var(--muted);font-weight:500}
.br .b,.gbar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:7px}
.br .b i,.gbar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.gbar{height:8px;margin:10px 0 6px}
svg.ch{display:block;width:100%;height:auto}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .ax{fill:var(--muted);font-size:10px}
.ch .ln{fill:none;stroke:var(--text);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch .pt{fill:var(--text);stroke:var(--surface);stroke-width:2}
.ch .pv{fill:var(--text);font-size:10px;font-weight:700;text-anchor:middle}
.ch .goal{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{background:var(--surface2);border-radius:12px;padding:12px;text-align:center}
.cmp b{display:block;font-size:28px;font-weight:700}
.cmp span{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;flex:none}
.ring svg{display:block;width:100%;height:100%}
.rt{fill:none;stroke:var(--track);stroke-width:7}
.rv{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.ring.sm .rt,.ring.sm .rv{stroke-width:6}
.rl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.rl b{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rl small{font-size:.5em;font-weight:600}
.rl span{font-size:11px;color:var(--muted);margin-top:2px}
.ring.sm .rl b{font-size:19px}
.hero-r{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.k b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.k span{font-size:12px;color:var(--muted)}
.delta{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{text-align:center;padding:12px 4px 10px;border-radius:12px;background:var(--surface2)}
.tile .ring{margin:0 auto 6px}
.tile b{display:block;font-size:13px;font-weight:600}
.tile span{display:block;font-size:12px;color:var(--muted)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;min-height:36px}
.sh h3{margin:0}
.sh button{border:0;background:none;color:var(--text);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:48px;padding:0 4px;margin:-6px 0}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pn{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:0 14px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;background:var(--bg)}
.ph h2{font-size:20px;font-weight:700}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* ===== Liquid glass (monochrome) ===== */
:root{--glass:rgba(255,255,255,.58);--gedge:rgba(255,255,255,.95);--gedge2:rgba(255,255,255,.35);--gsh:rgba(20,20,30,.14);--spec:.7;--panel:rgba(246,246,248,.88);--btn:rgba(255,255,255,.62);--tint:rgba(110,110,125,.13);--bgA:#f0f0f2;--bgB:#d9d9de;--blobA:rgba(255,255,255,.95);--blobB:rgba(150,150,168,.38)}
@media (prefers-color-scheme:dark){:root{--glass:rgba(70,70,78,.4);--gedge:rgba(255,255,255,.22);--gedge2:rgba(255,255,255,.06);--gsh:rgba(0,0,0,.55);--spec:.14;--panel:rgba(22,22,25,.88);--btn:rgba(255,255,255,.08);--tint:rgba(255,255,255,.07);--bgA:#050506;--bgB:#141416;--blobA:rgba(130,130,148,.34);--blobB:rgba(80,80,98,.4)}}
body{background:linear-gradient(165deg,var(--bgA),var(--bgB))}
body::before{content:'';position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(40% 30% at 15% 10%,var(--blobA),transparent 70%),radial-gradient(36% 30% at 90% 32%,var(--blobB),transparent 70%),radial-gradient(42% 34% at 18% 90%,var(--blobB),transparent 70%),radial-gradient(30% 26% at 92% 88%,var(--blobA),transparent 70%)}
#app{background:transparent}
.card,.scard,.kpi,#hdr,#live,#actions,#nav{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--gedge);box-shadow:0 10px 30px var(--gsh),inset 0 1px 0 var(--gedge),inset 0 -1px 0 var(--gedge2)}
.card::before,.scard::before,.kpi::before,#hdr::before,#live::before,#actions::before,#nav::before{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,var(--spec)),rgba(255,255,255,0) 36%,rgba(255,255,255,0) 72%,rgba(255,255,255,calc(var(--spec)*.45)))}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.scard,.kpi,#hdr,#live,#actions,#nav{background:var(--panel)}}
#topbar{background:none;border:0;pointer-events:none}
#topbar>*{pointer-events:auto}
#bottombar{background:none;border:0;display:flex;flex-direction:column;gap:8px;padding:0 12px calc(env(safe-area-inset-bottom) + 8px);pointer-events:none}
#bottombar>*{pointer-events:auto}
#hdr{margin:8px 12px 0;padding:2px 4px 2px 20px;border-radius:28px}
#live{margin:8px 12px 0;padding:8px 16px 2px;border-radius:28px}
#actions{padding:10px;border-radius:30px}
#nav{padding:5px;border-radius:32px;gap:2px}
#nav button{border-radius:26px}
#nav button.on{background:var(--tint);box-shadow:inset 0 1px 0 var(--gedge),0 0 0 1px var(--gedge2)}
#nav button.on::before{display:none}
#live.f-ok{animation:fok .5s}#live.f-ko{animation:fko .5s}
@keyframes fok{0%{background:var(--okbg)}100%{background:var(--glass)}}
@keyframes fko{0%{background:var(--kobg)}100%{background:var(--glass)}}
.card{border-radius:26px}.scard{border-radius:24px}.kpi{border-radius:22px}
.btn,.chip,.undo{background:var(--btn);border:1px solid var(--gedge);box-shadow:inset 0 1px 0 var(--gedge),0 2px 8px var(--gsh)}
.btn{border-radius:18px}.btn.xl{border-radius:22px}
.btn.pri,.chip.on,.seg button.on,.resume{background:var(--accent);color:var(--accent-t);border-color:var(--gedge);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px var(--gsh)}
.btn.danger{color:var(--ko)}
.undo{border-radius:20px}
.seg{background:var(--tint);border-radius:20px}.seg button{border-radius:16px}
.seg button.on.okc,.seg button.on.koc{box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.shot{border:1px solid rgba(255,255,255,.45);border-radius:26px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.shot.ok{background:linear-gradient(180deg,#2fbf6a,#17924a 60%,#0f7a3a);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 16px rgba(0,60,25,.3),0 10px 26px rgba(22,163,74,.4)}
.shot.ko{background:linear-gradient(180deg,#f25b5b,#d02a2a 60%,#b01c1c);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 16px rgba(90,0,0,.3),0 10px 26px rgba(220,38,38,.4)}
.resume{border-radius:26px}
.d{box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.tile,.cmp>div{background:var(--tint);border-radius:18px}
.court{border-radius:18px;background:var(--tint);box-shadow:inset 0 0 0 1px var(--gedge2)}
.court .z{fill:var(--tint)}
.court .z.sel{fill:var(--accent)}
.sw i{background:var(--tint);border:1px solid var(--gedge2)}
.sw input:checked+i{background:var(--accent);border-color:var(--gedge)}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--btn);border:1px solid var(--gedge);border-radius:16px;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.br .b,.gbar{background:var(--tint);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.bd{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pn{background:var(--panel);-webkit-backdrop-filter:blur(36px) saturate(170%);backdrop-filter:blur(36px) saturate(170%);border:1px solid var(--gedge);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:0 -10px 40px var(--gsh),inset 0 1px 0 var(--gedge)}
.ph{background:linear-gradient(var(--panel) 70%,transparent)}
.tag{background:var(--tint)}
.tag.pz{background:var(--accent);color:var(--accent-t)}
#toast{background:var(--panel);color:var(--text);border:1px solid var(--gedge);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:20px;box-shadow:0 8px 24px var(--gsh)}
.btn.ico{background:none;border:0;box-shadow:none}
.rt{stroke:rgba(128,128,140,.3)}
/* ===== Touches iOS / One UI ===== */
:root{--segon:#fff;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Samsung One UI Sans","SamsungOne",Roboto,"Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--segon:rgba(120,120,132,.55)}}
body{font-family:var(--font);font-size:17px;letter-spacing:-.011em}
/* gros boutons Réussi / Raté : ~60 % de la taille précédente */
.shot{height:clamp(52px,9vh,78px);height:clamp(52px,9dvh,78px);font-size:20px;gap:8px;border-radius:22px}
.resume{height:clamp(52px,9vh,78px);font-size:20px;border-radius:22px}
.shot.ok,.shot.ko{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -5px 10px rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.25)}
#actions{padding:8px;border-radius:30px}
.undo{min-height:48px;margin-bottom:8px;font-size:15px}
/* barre de titre façon iOS (grand titre) */
#topbar{padding-top:0}
#hdr{margin:0;border-radius:0;border-width:0 0 1px;border-color:var(--gedge2);box-shadow:none;padding:calc(env(safe-area-inset-top) + 6px) 8px 4px 20px;min-height:calc(env(safe-area-inset-top) + 66px);align-items:flex-end}
#hdr::before{display:none}
#hdr h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;padding-bottom:6px}
#live{margin-top:calc(env(safe-area-inset-top) + 8px)}
/* barre d'onglets docquée + pastille One UI */
#bottombar{padding:0;gap:8px}
#actions{margin:0 12px}
#nav{border-radius:0;border-width:1px 0 0;border-color:var(--gedge2);box-shadow:none;padding:6px 6px calc(env(safe-area-inset-bottom) + 4px)}
#nav::before{display:none}
#nav button{font-size:10.5px;font-weight:600;border-radius:22px;min-height:56px}
#nav button.on{background:var(--tint);box-shadow:none}
/* cartes arrondies One UI */
.card{border-radius:30px;padding:18px}
.scard{border-radius:28px}
.kpi{border-radius:26px}
.btn{border-radius:999px}.btn.xl{border-radius:999px}
.btn.block{border-radius:999px}
.undo{border-radius:999px}
.tile{border-radius:22px}
/* listes groupées (lignes séparées) */
.card .row+.row{border-top:1px solid var(--line)}
.card .row{min-height:56px}
.mh,h3{font-size:13px;letter-spacing:.04em;font-weight:600}
/* contrôle segmenté iOS */
.seg{background:var(--tint);border-radius:12px;padding:2px;gap:2px}
.seg button{min-height:46px;border-radius:10px;font-weight:600;font-size:15px}
.seg button.on{background:var(--segon);color:var(--text);border-color:transparent;box-shadow:0 2px 6px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06)}
.seg button.on.okc{background:var(--ok);color:#fff}
.seg button.on.koc{background:var(--ko);color:#fff}
/* interrupteurs iOS */
.sw{width:51px;height:31px}
.sw i{border-radius:16px}
.sw i::after{left:2px;top:2px;width:27px;height:27px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.sw input:checked+i::after{transform:translateX(20px)}
/* feuilles iOS avec poignée */
.pn{border-radius:34px 34px 0 0}
.ph{padding-top:22px}
.ph::before{content:'';position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:rgba(128,128,140,.5)}
.ph h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh button{text-decoration:none;font-weight:600}
.btn:active,.chip:active,.scard:active,#nav button:active{opacity:.6;transform:none}

/* ===== Programmes ===== */
.pl{padding:2px 0 6px}
.pl-t{display:flex;align-items:center;gap:8px;font-size:15px}
.pl-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pl-c{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pl-c small{font-size:15px;font-weight:600;color:var(--muted)}
.pl .gbar{height:8px;margin:6px 0 4px}
.pl-ok{text-align:center;font-weight:700;font-size:14px;padding:2px 0 4px}
.pl-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pl-act .undo{margin-bottom:0}
.undo.nxt{font-weight:700}
.undo.nxt.hit{background:var(--accent);color:var(--accent-t);border-color:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(128,128,140,.55)}50%{box-shadow:0 0 0 9px rgba(128,128,140,0)}}
.pe-btns{display:flex}
.btn.ico:disabled{opacity:.3}
.ph{background:var(--bg);box-shadow:0 8px 12px -8px var(--bg)}
.vlog{margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--tint);font-size:13px;color:var(--muted);line-height:1.5}
.vlog div:first-child{color:var(--text);font-weight:600}
.vlog .vs{font-size:12px;opacity:.7;font-weight:400}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <div id="topbar"><header id="hdr"></header><section id="live" hidden></section></div>
  <div id="bottombar">
    <div id="actions" hidden></div>
    <nav id="nav" aria-label="Navigation">
      <button data-a="tab" data-v="accueil"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></svg>Accueil</button>
      <button data-a="tab" data-v="saisie"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6c3 2.6 3 10.2 0 12.8M18.4 5.6c-3 2.6-3 10.2 0 12.8"/></svg>Saisie</button>
      <button data-a="tab" data-v="histo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button>
      <button data-a="tab" data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
      <button data-a="tab" data-v="obj"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Objectifs</button>
    </nav>
  </div>
</div>
<div id="sheets"></div>
<div id="toast" role="status"></div>
<input type="file" id="fi" accept=".csv,text/csv,text/plain" hidden>

<script>
'use strict';
/* ========== Utilitaires ========== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const parseISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const fmtDate=s=>parseISO(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const NB='\u00A0';
const pct=(m,n)=>n?Math.round(100*m/n):null;
const fmtPct=(m,n)=>n?pct(m,n)+NB+'%':'–'+NB+'%';
const heat=p=>{const a=[[220,74,79],[122,122,128],[34,168,90]],t=Math.max(0,Math.min(100,p))/50,i=Math.min(1,Math.floor(t)),f=t-i;return 'rgb('+a[i].map((v,k)=>Math.round(v+(a[i+1][k]-v)*f)).join(',')+')'};
const fmtDur=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+pad(m):m)+':'+pad(s)};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

/* ========== Constantes ========== */
const TYPES={ft:'Lancer franc','2':'2 points','3':'3 points',layup:'Layup',mid:'Mi-distance'};
const ZONES={paint:'Raquette',ft:'Lancer franc',mid_l:'Mi-distance gauche',mid_c:'Mi-distance centre',mid_r:'Mi-distance droite',corner_l:'Corner gauche',corner_r:'Corner droit',wing_l:'3 pts aile gauche',axis:'3 pts axe',wing_r:'3 pts aile droite'};
const SITS={arret:'Tir arrêté',mvt:'En mouvement',press:'Sous pression',passe:'Sur passe',dribble:'Après dribble'};
const ZT={ft:['ft'],paint:['2','layup'],mid_l:['2','mid'],mid_c:['2','mid'],mid_r:['2','mid'],corner_l:['3'],corner_r:['3'],wing_l:['3'],axis:['3'],wing_r:['3']};
const LBL={paint:[150,52],ft:[150,96],mid_l:[78,80],mid_c:[150,128],mid_r:[222,80],corner_l:[22,56],corner_r:[278,56],wing_l:[45,160],axis:[150,185],wing_r:[255,160]};
const GSCOPE=Object.assign({all:'Global'},TYPES);

/* ========== Données ========== */
const KEY='tirsBasket.v1';
const defDB=()=>({v:1,sessions:[],goals:[],plans:[],activeId:null,settings:{detailed:false,layup:false,mid:false,voice:false,beep:false,beepV:2,speak:true,vcont:true,vint:true},sel:{ty:'2',z:null,s:null}});
function loadDB(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw),b=defDB();
    const out=Object.assign(b,d,{settings:Object.assign(b.settings,d.settings||{}),sel:Object.assign(b.sel,d.sel||{})});
    if(out.settings.beepV!==2){out.settings.beep=false;out.settings.beepV=2}
    return out;}}catch(e){}
  return defDB();
}
let db=loadDB();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠ Stockage plein ou indisponible')}}
const active=()=>db.sessions.find(s=>s.id===db.activeId&&s.status!=='done')||null;
const sessById=id=>db.sessions.find(s=>s.id===id);
const enabledTypes=()=>['ft','2','3'].concat(db.settings.layup?['layup']:[],db.settings.mid?['mid']:[]);
function fixSel(){const en=enabledTypes();if(!en.includes(db.sel.ty)){db.sel.ty='2';if(db.sel.z&&!ZT[db.sel.z].includes('2'))db.sel.z=null}}
const elapsedMs=s=>(s.elapsed||0)+(s.status==='active'&&s.segStart?Date.now()-s.segStart:0);
const durMinOf=s=>s.durMin!=null?s.durMin:(s.elapsed>0?Math.max(1,Math.round(s.elapsed/60000)):null);
const titleOf=s=>s.kind==='match'?(s.opp?'Match vs '+s.opp:'Match'):(s.ex||'Entraînement');
const sumShots=a=>a.reduce((x,h)=>x+h.m,0);
(function recover(){const s=active();if(!s||s.status!=='active')return;const now=Date.now(),last=s.lastTick||s.segStart||now;
  s.elapsed=(s.elapsed||0)+Math.max(0,last-(s.segStart||last));
  if(now-last<15*60000){s.segStart=now;s.lastTick=now}else{s.segStart=null;s.status='paused'}
  if(!active()||s.status==='done')db.activeId=null;fixSel();save();})();

/* ========== État UI ========== */
const ui={tab:'accueil',lastTab:null,sheets:[],flash:null,
  form:{kind:'training',date:todayISO(),dt:0,opp:'',place:'',ex:'',dur:'',defType:'',note:'',plan:''},
  st:{period:'all',kind:'all',type:'all',range:'week'}};
const topSheet=()=>ui.sheets[ui.sheets.length-1];

/* ========== Écran de veille / vibration ========== */
let wl=null;
async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function release(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{const s=active();
  if(document.hidden){if(s&&s.status==='active'){s.lastTick=Date.now();save()}}
  else if(s&&s.status==='active')wake()});
window.addEventListener('pagehide',()=>{const s=active();if(s&&s.status==='active'){s.lastTick=Date.now();save()}});

/* ========== Commande vocale ========== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,audioCtx=null,voiceFails=0,voiceStart=0,lastCmd={c:'',t:0},speaking=false,speakTimer=null;
ui.vlog=[];
const normTxt=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z\s]/g,' ');
const RX_OK=/^(oui+|ouais|ouai|ouaip|ouin|ouis|oue|wi+|ui+|yes|yeah)$/;
const RX_KO=/^(no+n*|na+n+|nom)$/;
const RX_NX=/^(suivant|suivants|suivante|prochain)$/;
const RX_UN=/^(annule|annuler|annulee|corrige|corriger|erreur)$/;
const tokensOf=t=>normTxt(t).split(/\s+/).filter(Boolean).flatMap(w=>{const m=w.match(/^(oui|non|nan)\1+$/);return m?Array(w.length/m[1].length).fill(m[1]):[w]});
const cmdOf=w=>RX_OK.test(w)?'ok':RX_KO.test(w)?'ko':RX_UN.test(w)?'un':RX_NX.test(w)?'nx':null;
function voiceCmds(text){return tokensOf(text).map(cmdOf).filter(Boolean)}
const voiceWanted=()=>!!(SR&&db.settings.voice&&active()&&!speaking&&!(ui.vtest&&ui.vtest.on));
function unlockAudio(){
  if(!db.settings.beep||!db.settings.voice)return;
  try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}catch(e){}
}
function beep(k){
  if(!db.settings.beep||!audioCtx)return;
  try{const seq=k==='ok'?[[880,.12]]:k==='ko'?[[300,.22]]:k==='reach'?[[660,.1],[880,.1],[1180,.24]]:k==='next'?[[520,.08],[780,.14]]:[[620,.08],[460,.08]];let t=audioCtx.currentTime;
    for(const [f,d] of seq){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+d);t+=d+.03}}catch(e){}
}
function vstat(){
  if(!db.settings.voice)return ui.voiceErr||'Désactivée';
  const s=active();if(s&&s.status==='paused')return 'En pause';
  return ui.listening?'● À l’écoute…':'Démarrage du micro…';
}
function refreshVoiceStatus(){const el=$('#vstat');if(el)el.textContent=vstat()}
function voiceApply(c){
  if(ui.vtest&&ui.vtest.on){const k=ui.vtest.cnt;k[c]=(k[c]||0)+1;vtLog('   → compté par l\u2019appli : '+c);vtCount();return}
  const s=active();if(!s||s.status!=='active')return;
  if(c==='nx'){nextEx(true);return}
  if(c==='un'){if(!s.shots.length)return;undoShot()}else addShot(c==='ok');
  beep(c);
}
/* Chaque mot de chaque résultat est traité une seule fois (compteur par résultat) :
   « oui oui oui » enregistre bien 3 tirs. Les résultats provisoires sont pris en compte
   après 0,4 s de stabilité, pour ne pas attendre la fin de la phrase. */
function logFor(r,i,fresh){
  let en=r._l[i];
  if(!en||fresh){en={txt:'',k:0,fin:false};r._l[i]=en;ui.vlog.push(en);if(ui.vlog.length>10)ui.vlog.shift()}
  return en;
}
/* Suivi par résultat : chaque mot n'est compté qu'une fois, mais un résultat qui est réutilisé
   par le moteur pour une nouvelle phrase (après une phrase terminée) repart de zéro. */
function procResult(r,i,text,fin){
  const tk=tokensOf(text);if(!tk.length)return;
  const st=r._d[i]||(r._d[i]={tk:[],fin:false,t:0}),now=Date.now();
  const ext=st.tk.length>0&&tk.length>=st.tk.length&&st.tk.every((w,j)=>tk[j]===w);
  let from=0;
  if(!st.tk.length)from=0;
  else if(ext)from=(st.fin&&tk.length===st.tk.length&&now-st.t>700)?0:st.tk.length;
  else if(!st.fin)from=Math.min(st.tk.length,tk.length);
  else from=0;
  const en=logFor(r,i,st.tk.length>0&&from===0);
  en.txt=text;en.fin=fin;
  st.tk=tk;st.fin=fin;st.t=now;
  for(let j=from;j<tk.length;j++){const c=cmdOf(tk[j]);if(c){en.k++;voiceApply(c)}}
}
const vlogHTML=()=>ui.vlog.length?ui.vlog.slice(-6).reverse().map(x=>x.sys?`<div class="vs">· ${esc(x.txt)}</div>`:`<div>${x.fin?'✓':'…'} « ${esc(x.txt)} » → ${x.k} tir${x.k>1?'s':''}</div>`).join(''):'<div>Rien entendu pour l\u2019instant</div>';
function vlogSys(txt){const l=ui.vlog[ui.vlog.length-1];if(l&&l.sys)l.txt=txt;else{ui.vlog.push({sys:true,txt});if(ui.vlog.length>10)ui.vlog.shift()}const h=$('#heard');if(h)h.innerHTML=vlogHTML()}
function onVoice(e){
  const r=e.target;if(!r._d)r._d={};if(!r._l)r._l={};
  for(let i=e.resultIndex||0;i<e.results.length;i++){
    const res=e.results[i];if(!res||!res[0])continue;
    const fin=!!res.isFinal,txt=String(res[0].transcript||'').trim();
    if(txt)procResult(r,i,txt,fin);
  }
  const h=$('#heard');if(h)h.innerHTML=vlogHTML();
}
function stopVoice(){if(rec){try{rec.onend=null;rec.onerror=null;rec.abort()}catch(e){}rec=null}ui.listening=false}
function voiceFatal(msg){ui.voiceErr=msg;db.settings.voice=false;save();stopVoice();refresh();toast('🎤 '+msg)}
function startVoice(){
  if(!SR||rec)return;
  const r=new SR();r.lang='fr-FR';r.continuous=db.settings.vcont!==false;r.interimResults=db.settings.vint!==false;r.maxAlternatives=1;
  r._d={};r._l={};r._got=false;r._t0=Date.now();
  r.onresult=e=>{r._got=true;onVoice(e)};
  r.onstart=()=>{ui.listening=true;refreshVoiceStatus()};
  r.onerror=e=>{const k=e.error;
    if(k==='not-allowed'||k==='service-not-allowed')voiceFatal('Micro refusé : autorisez-le dans les réglages du navigateur.');
    else if(k==='network')voiceFatal('Reconnaissance vocale indisponible : une connexion Internet est nécessaire.');
    else if(k==='audio-capture')voiceFatal('Aucun micro détecté.');
    else if(k!=='no-speech'&&k!=='aborted')vlogSys('erreur micro : '+k)};
  r.onend=()=>{ui.listening=false;if(rec===r)rec=null;
    const dur=Date.now()-r._t0;
    if(!r._got&&dur<1500)voiceFails++;else voiceFails=0;
    if(voiceFails>=5){voiceFatal('La reconnaissance vocale s’arrête sans cesse. Réessayez.');return}
    vlogSys('micro relancé (écoute de '+(dur/1000).toFixed(1)+' s)');
    refreshVoiceStatus();
    if(voiceWanted())startVoice()};
  try{rec=r;r.start()}catch(e){rec=null;setTimeout(syncVoice,300)}
}
function syncVoice(){if(voiceWanted()){if(!rec)startVoice()}else if(rec)stopVoice()}
function voiceCard(){
  if(!SR)return `<div class="card"><b>🎤 Commande vocale</b><p class="mut small" style="margin:6px 0 0">Non disponible sur ce navigateur (essayez Chrome sur Android ou Safari sur iPhone).</p></div>`;
  const on=db.settings.voice;
  return `<div class="card"><label class="row"><span><b>🎤 Commande vocale</b><br><small class="mut" id="vstat">${esc(vstat())}</small></span><span class="sw"><input type="checkbox" data-c="set" data-k="voice" ${on?'checked':''}><i></i></span></label>
  ${on?`<p class="mut small" style="margin:6px 0 0">Dites <b>« oui »</b> (réussi), <b>« non »</b> (raté)${active()&&active().plan?', <b>« annule »</b> ou <b>« suivant »</b>':' ou <b>« annule »</b>'}. </p><div id="heard" class="vlog">${vlogHTML()}</div>`:''}</div>`;
}

/* ========== Test du micro (diagnostic) ========== */
ui.vtest=null;
const vtCountHTML=()=>{const c=ui.vtest.cnt;return 'Compté par l’appli : oui ×'+(c.ok||0)+' · non ×'+(c.ko||0)+' · annule ×'+(c.un||0)+' · suivant ×'+(c.nx||0)};
function vtLog(msg){const v=ui.vtest;if(!v)return;v.log.push('+'+((Date.now()-v.t0)/1000).toFixed(2)+'  '+msg);if(v.log.length>400)v.log.shift();const ta=$('#vtlog');if(ta){ta.value=v.log.join('\n');ta.scrollTop=ta.scrollHeight}}
function vtCount(){const el=$('#vtcnt');if(el&&ui.vtest)el.textContent=vtCountHTML()}
function vtStop(){
  const v=ui.vtest;if(!v)return;v.on=false;
  if(v.rec){try{v.rec.onend=null;v.rec.abort()}catch(e){}v.rec=null}
  const b=$('#vtbtn');if(b)b.textContent='▶ Démarrer';
  setTimeout(syncVoice,60);
}
function vtStart(){
  const v=ui.vtest;if(!v||!SR)return;
  stopVoice();v.on=true;
  if(!v.log.length){v.t0=Date.now();v.log.push('Navigateur : '+navigator.userAgent);v.log.push('continu='+(db.settings.vcont!==false)+'  provisoires='+(db.settings.vint!==false))}
  vtSession();
  const b=$('#vtbtn');if(b)b.textContent='■ Arrêter';
}
function vtSession(){
  const v=ui.vtest;if(!v||!v.on)return;
  const r=new SR();r.lang='fr-FR';r.continuous=db.settings.vcont!==false;r.interimResults=db.settings.vint!==false;r.maxAlternatives=1;
  r._d={};r._l={};v.rec=r;vtLog('— démarrage du micro —');
  ['audiostart','soundstart','speechstart','speechend','soundend','audioend','nomatch'].forEach(n=>{r['on'+n]=()=>vtLog(n)});
  r.onstart=()=>vtLog('start');
  r.onerror=e=>vtLog('ERREUR '+e.error);
  r.onend=()=>{vtLog('end');if(v.on&&v.rec===r){v.rec=null;vtSession()}};
  r.onresult=e=>{
    const parts=[];
    for(let i=e.resultIndex||0;i<e.results.length;i++){
      const res=e.results[i],alts=[];
      for(let a=0;a<res.length;a++)alts.push('« '+String(res[a].transcript).trim()+' » '+(res[a].confidence||0).toFixed(2));
      parts.push('#'+i+(res.isFinal?' FINAL ':' prov ')+alts.join(' | '));
    }
    vtLog('résultat (index '+(e.resultIndex||0)+', total '+e.results.length+') : '+parts.join('  ;  '));
    onVoice(e);
  };
  try{r.start()}catch(err){vtLog('start() a échoué : '+err);v.rec=null;v.on=false}
}
async function vtCopy(){
  const v=ui.vtest;if(!v)return;
  const text=v.log.join('\n')+'\n\n'+vtCountHTML();

  if(ta){ta.removeAttribute('readonly');ta.select();try{document.execCommand('copy');toast('Journal copié ✓')}catch(e){toast('Sélectionnez le texte et copiez-le')}ta.setAttribute('readonly','')}
}

/* ========== Programmes d'entraînement ========== */
const planById=id=>db.plans.find(p=>p.id===id);
function defTypeForZone(z){if(!z)return '';if(z==='ft')return 'ft';const ok=ZT[z];if(ok[0]==='3')return '3';if(z==='paint')return db.settings.layup?'layup':'2';return db.settings.mid?'mid':'2'}
function exLabel(e){return e.name||(e.zone?ZONES[e.zone]:(e.ty?TYPES[e.ty]:'Tirs libres'))}
const exFull=e=>exLabel(e)+(e.sit&&SITS[e.sit]?' ('+SITS[e.sit].toLowerCase()+')':'')
const curEx=s=>s&&s.plan?(s.plan.ex[s.plan.idx]||null):null;
function exStats(s,i){let m=0,n=0;for(const h of s.shots)if(h.e===i){n++;m+=h.m}return{m,n}}
const exReached=s=>{const e=curEx(s);return !!e&&exStats(s,s.plan.idx).m>=e.target};
function speak(text){
  if(!db.settings.speak||!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return;
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=1.05;
    const done=()=>{if(!speaking)return;speaking=false;clearTimeout(speakTimer);setTimeout(syncVoice,500)};
    u.onend=done;u.onerror=done;
    speaking=true;stopVoice();
    clearTimeout(speakTimer);speakTimer=setTimeout(done,3000+text.length*90);
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){speaking=false}
}
function announceEx(s){
  const e=curEx(s);if(!e)return;
  speak('Exercice '+(s.plan.idx+1)+' sur '+s.plan.ex.length+'. '+exLabel(e).replace(/\bpts\b/g,'points')+(e.sit&&SITS[e.sit]?', '+SITS[e.sit].toLowerCase():'')+'. Objectif : '+e.target+(e.target>1?' réussis.':' réussi.'));
}
function notifyReached(s){
  const e=curEx(s),last=s.plan.idx>=s.plan.ex.length-1;
  buzz([70,60,70,60,170]);beep('reach');
  toast('✓ Objectif atteint ('+e.target+'/'+e.target+') – dites « suivant »');
  speak(last?'Dernier exercice terminé. Dites suivant pour finir.':'Objectif atteint. Dites suivant.');
}
function nextEx(fromVoice){
  const s=active();if(!s||!s.plan||s.status!=='active')return;
  const p=s.plan,reached=exReached(s),last=p.idx>=p.ex.length-1;
  if(last){
    if(!reached){if(fromVoice)return;if(!confirm('Terminer le programme sans avoir atteint l’objectif ?'))return}
    finishPlan();return;
  }
  p.idx++;s.lastTick=Date.now();save();buzz(30);beep('next');refresh();announceEx(s);
}
function finishPlan(){
  const s=active();if(!s)return;
  if(!s.shots.length)db.sessions=db.sessions.filter(x=>x!==s);
  else{s.elapsed=elapsedMs(s);s.segStart=null;s.status='done'}
  db.activeId=null;save();release();ui.tab='histo';refresh();toast('Programme terminé ✓');speak('Programme terminé. Bravo.');
}
function planBar(s){
  const e=curEx(s);if(!e)return '';
  const st=exStats(s,s.plan.idx),done=st.m>=e.target,pc=Math.min(100,Math.round(100*st.m/e.target));
  const sub=[(e.name||!e.zone)&&e.ty?TYPES[e.ty]:'',e.sit&&SITS[e.sit]?SITS[e.sit]:''].filter(Boolean).map(x=>' · '+x).join('');
  return `<div class="pl"><div class="pl-t"><span class="tag">${s.plan.idx+1}/${s.plan.ex.length}</span><span class="pl-l">${esc(exLabel(e))}${sub}</span><b class="pl-c">${st.m}<small>/${e.target}</small></b></div><div class="gbar"><i style="width:${pc}%"></i></div>${done?'<div class="pl-ok">✓ Objectif atteint · dites « suivant »</div>':''}</div>`;
}

/* ========== Logique de saisie ========== */
function applyZone(d,z){
  if(d.z===z){d.z=null;return}
  d.z=z;const ok=ZT[z];
  if(!ok.includes(d.ty)){d.ty=z==='ft'?'ft':ok[0]==='3'?'3':z==='paint'?(db.settings.layup?'layup':'2'):(db.settings.mid?'mid':'2')}
}
function applyType(d,t,toggle){
  if(toggle&&d.ty===t){d.ty=null;return}
  d.ty=t;if(t==='ft')d.z='ft';else if(d.z&&!ZT[d.z].includes(t))d.z=null;
}
function startSession(){
  const f=ui.form,kind=f.kind;
  const s={id:uid(),kind,date:f.date||todayISO(),createdAt:Date.now(),opp:kind==='match'?f.opp.trim():'',place:kind==='match'?f.place.trim():'',
    ex:kind==='training'?f.ex.trim():'',durMin:kind==='training'&&f.dur!==''?Math.max(1,parseInt(f.dur,10)||1):null,note:f.note.trim(),
    defType:kind==='training'&&f.defType?f.defType:null,shots:[],status:'active',elapsed:0,segStart:Date.now(),lastTick:Date.now()};
  const pl=kind==='training'&&f.plan?planById(f.plan):null;
  if(pl){s.plan={pid:pl.id,name:pl.name,idx:0,ex:JSON.parse(JSON.stringify(pl.ex))};s.ex=pl.name;s.defType=null;s.durMin=null}
  db.sessions.push(s);db.activeId=s.id;
  if(s.defType){applyType(db.sel,s.defType,false)}
  ui.form.opp='';ui.form.place='';ui.form.note='';ui.form.dur='';ui.form.dt=0;
  save();wake();refresh();if(s.plan)announceEx(s);
}
function addShot(made){
  const s=active();if(!s||s.status!=='active')return;
  let ty=null,z=null,si=null,ei=null;
  const ce=curEx(s);
  if(ce){ty=ce.ty||null;z=ce.zone||null;si=ce.sit||null;ei=s.plan.idx}
  else if(db.settings.detailed){ty=db.sel.ty;z=db.sel.z;si=db.sel.s}
  else{ty=s.defType||null;if(ty==='ft')z='ft'}
  const h={t:Date.now(),m:made?1:0,ty,z,s:si};if(ei!=null)h.e=ei;
  s.shots.push(h);
  s.lastTick=Date.now();ui.flash=made?'ok':'ko';
  buzz(made?25:[18,30,18]);save();wake();refresh();
  if(ce&&made&&exStats(s,ei).m===ce.target)notifyReached(s);
}
function undoShot(){
  const s=active();if(!s||!s.shots.length)return;
  const h=s.shots.pop();save();buzz(15);toast('Dernier tir annulé ('+(h.m?'réussi':'raté')+')');refresh();
}
function pauseS(){const s=active();if(!s||s.status!=='active')return;s.elapsed=elapsedMs(s);s.segStart=null;s.status='paused';save();release();refresh()}
function resumeS(){const s=active();if(!s||s.status!=='paused')return;s.status='active';s.segStart=Date.now();s.lastTick=Date.now();save();wake();refresh()}
function finishS(){
  const s=active();if(!s)return;
  if(!s.shots.length){if(confirm('Aucun tir enregistré. Supprimer cette session ?')){db.sessions=db.sessions.filter(x=>x!==s);db.activeId=null;save();release();refresh();toast('Session supprimée')}return}
  if(!confirm('Terminer la session ?\n'+sumShots(s.shots)+'/'+s.shots.length+' – '+fmtPct(sumShots(s.shots),s.shots.length)))return;
  s.elapsed=elapsedMs(s);s.segStart=null;s.status='done';db.activeId=null;save();release();
  ui.tab='histo';refresh();toast('Session terminée ✓');
}

/* ========== Filtres / statistiques ========== */
const cutoffISO=days=>{const d=new Date();d.setDate(d.getDate()-days);return isoOf(d)};
function filtSessions(f,ignoreKind){
  const cut=f.period==='all'?null:cutoffISO(+f.period);
  return db.sessions.filter(s=>(!cut||s.date>=cut)&&(ignoreKind||f.kind==='all'||s.kind===f.kind));
}
function shotsOf(sessions,type){
  const out=[];for(const s of sessions)for(const h of s.shots)if(type==='all'||h.ty===type)out.push({t:h.t,m:h.m,ty:h.ty,z:h.z,s:h.s,sid:s.id,kind:s.kind,date:s.date});
  return out;
}
function agg(shots,keyFn){const o={};for(const h of shots){const k=keyFn(h);if(!o[k])o[k]={m:0,n:0};o[k].n++;o[k].m+=h.m}return o}
const weekKey=ds=>{const d=parseISO(ds);d.setDate(d.getDate()-(d.getDay()+6)%7);return isoOf(d)};
function barRow(label,a){
  if(!a||!a.n)return '';
  const p=pct(a.m,a.n);
  return `<div class="br"><div class="t"><span>${esc(label)}</span><span>${p}${NB}% <em>(${a.m}/${a.n})</em></span></div><div class="b"><i style="width:${p}%"></i></div></div>`;
}

/* ========== Rendu : terrain ========== */
function courtSVG(o){
  const R=125,cy=34+Math.sqrt(R*R-105*105);
  const P=(g,r)=>{const a=g*Math.PI/180;return[150+r*Math.sin(a),34+r*Math.cos(a)]};
  const f=n=>n.toFixed(1);
  const QL=P(-25,R),QR=P(25,R),W1=P(-90,600),W2=P(-25,600),W3=P(25,600),W4=P(90,600);
  const cyS=f(cy);
  const shapes=[
    ['wing_l',`M150,34L${f(W1[0])},${f(W1[1])}L${f(W2[0])},${f(W2[1])}Z`],
    ['axis',`M150,34L${f(W2[0])},${f(W2[1])}L${f(W3[0])},${f(W3[1])}Z`],
    ['wing_r',`M150,34L${f(W3[0])},${f(W3[1])}L${f(W4[0])},${f(W4[1])}Z`],
    ['corner_l',`M0,6H45V${cyS}H0Z`],
    ['corner_r',`M255,6H300V${cyS}H255Z`],
    ['mid_l',`M45,6V${cyS}A${R},${R} 0 0 0 ${f(QL[0])},${f(QL[1])}L150,34V6Z`],
    ['mid_c',`M${f(QL[0])},${f(QL[1])}A${R},${R} 0 0 0 ${f(QR[0])},${f(QR[1])}L150,34Z`],
    ['mid_r',`M255,6V${cyS}A${R},${R} 0 0 1 ${f(QR[0])},${f(QR[1])}L150,34V6Z`],
    ['paint','M108,6H192V96H108Z']
  ];
  const attrs=id=>{
    let a=`class="z${o.sel===id?' sel':''}"`;
    if(o.act)a+=` data-a="${o.act}" data-z="${id}"`;
    if(o.heat&&o.heat[id]&&o.heat[id].n)a+=` style="fill:${heat(pct(o.heat[id].m,o.heat[id].n))}"`;
    return a;
  };
  let h=`<svg class="court" viewBox="0 6 300 210" role="img" aria-label="Demi-terrain">`;
  for(const [id,d] of shapes)h+=`<path ${attrs(id)} d="${d}"/>`;
  h+=`<circle ${attrs('ft')} cx="150" cy="96" r="20"/>`;
  h+=`<path class="cl" d="M108,6V96H192V6"/><path class="cl" d="M114,96A36,36 0 0 0 186,96"/><path class="cl d" d="M114,96A36,36 0 0 1 186,96"/>`;
  h+=`<path class="cl" d="M45,6V${cyS}A${R},${R} 0 0 0 255,${cyS}V6"/><rect class="cl" x="0" y="6" width="300" height="210"/>`;
  h+=`<path class="cl" d="M138,25H162"/><circle class="rim" cx="150" cy="34" r="6"/>`;
  if(o.heat){
    for(const id in LBL){const a=o.heat[id];if(!a||!a.n)continue;const [x,y]=LBL[id];
      h+=id==='ft'?`<text class="hl" x="${x}" y="${y-1}" style="font-size:11px">${pct(a.m,a.n)}%</text><text class="hl n" x="${x}" y="${y+10}">${a.n}</text>`
        :`<text class="hl" x="${x}" y="${y}">${pct(a.m,a.n)}%</text><text class="hl n" x="${x}" y="${y+12}">${a.n} tir${a.n>1?'s':''}</text>`;}
  }else h+=`<text class="hint" x="150" y="99" style="font-size:9px;fill:var(--cline)">LF</text>`;
  return h+'</svg>';
}

function liveBar(s){

/* ========== Vue : Historique ========== */
function viewHisto(){
  const list=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  if(!list.length)return `<div class="empty"><b>Aucune session</b>Lancez votre première session depuis l'onglet Saisie.</div>`;
  let h='',lastM='';
  for(const s of list){
    const mo=parseISO(s.date).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    if(mo!==lastM){h+=`<div class="mh">${esc(mo)}</div>`;lastM=mo}
    const n=s.shots.length,m=sumShots(s.shots),p=pct(m,n),d=durMinOf(s);
    const st=s.id===db.activeId&&s.status!=='done'?(s.status==='paused'?' · En pause':' · En cours'):'';
    h+=`<button class="scard" data-a="opensess" data-id="${s.id}"><div class="l1"><span class="t">${s.kind==='match'?'🏆':'🏀'} ${esc(titleOf(s))}</span><span class="sc">${m}/${n} · ${fmtPct(m,n)}</span></div>
    <div class="s">${fmtDate(s.date)}${d?' · '+d+' min':''}${s.place?' · '+esc(s.place):''}${st}</div></button>`;
  }
  return h;
}

/* ========== Vue : Stats ========== */
function lineChart(pts,goal){
  const W=320,H=190,L=34,Rr=12,T=14,Bm=30,iw=W-L-Rr,ih=H-T-Bm;
  const X=i=>L+(pts.length===1?iw/2:iw*i/(pts.length-1)),Y=p=>T+ih*(1-p/100);
  let g='';
  [0,25,50,75,100].forEach(v=>{g+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`});
  if(goal!=null)g+=`<line class="goal" x1="${L}" x2="${W-Rr}" y1="${Y(goal)}" y2="${Y(goal)}"/>`;
  g+=`<path class="ln" d="${pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.p).toFixed(1)).join('')}"/>`;
  const step=Math.ceil(pts.length/6);
  pts.forEach((p,i)=>{
    g+=`<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.p).toFixed(1)}" r="4.5"><title>${p.p}% (${p.m}/${p.n})</title></circle>`;
    if(pts.length<=8)g+=`<text class="pv" x="${X(i).toFixed(1)}" y="${(Y(p.p)-9).toFixed(1)}">${p.p}%</text>`;
    if(i%step===0||i===pts.length-1)g+=`<text class="ax" x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du pourcentage de réussite">${g}</svg>`;
}
function evolution(sh,range){
  const o=agg(sh,h=>range==='week'?weekKey(h.date):h.date.slice(0,7));
  return Object.keys(o).sort().slice(-12).map(k=>{
    const label=range==='week'?parseISO(k).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}):parseISO(k+'-01').toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});
    return{k,label,m:o[k].m,n:o[k].n,p:pct(o[k].m,o[k].n)};
  });
}
function viewStats(){
  if(!db.sessions.length)return `<div class="empty"><b>Pas encore de statistiques</b>Enregistrez quelques tirs pour voir apparaître vos pourcentages, la carte de chaleur et votre progression.</div>`;
  const f=ui.st,sess=filtSessions(f),sh=shotsOf(sess,f.type),n=sh.length,m=sumShots(sh);
  const chip=(k,v,l)=>`<button class="chip${f[k]===v?' on':''}" data-a="stf" data-k="${k}" data-v="${v}">${l}</button>`;
  const typesAvail=Object.keys(TYPES).filter(k=>enabledTypes().includes(k)||shotsOf(db.sessions,k).length);
  let h=`<div class="card"><h3>Période</h3><div class="chips scroll">${chip('period','7','7 jours')}${chip('period','30','30 jours')}${chip('period','90','90 jours')}${chip('period','all','Tout')}</div>
    <h3>Session</h3><div class="chips scroll">${chip('kind','all','Toutes')}${chip('kind','training','Entraînement')}${chip('kind','match','Match')}</div>
    <h3>Type de tir</h3><div class="chips scroll">${chip('type','all','Tous')}${typesAvail.map(k=>chip('type',k,TYPES[k])).join('')}</div></div>`;
  if(!n)return h+`<div class="empty"><b>Aucun tir pour ces filtres</b>Élargissez la période ou changez de type.</div>`;
  let best=0;
  for(const s of sess){let c=0;for(const x of s.shots){if(f.type!=='all'&&x.ty!==f.type)continue;if(x.m){c++;if(c>best)best=c}else c=0}}
  const rows=sess.map(s=>{const hs=s.shots.filter(x=>f.type==='all'||x.ty===f.type);return{s,n:hs.length,m:sumShots(hs)}}).filter(r=>r.n>0);
  const pool=rows.filter(r=>r.n>=10),cand=(pool.length?pool:rows).sort((a,b)=>b.m/b.n-a.m/a.n||b.n-a.n),bs=cand[0];
  h+=`<div class="kpis">
    <div class="kpi"><b>${fmtPct(m,n)}</b><span>Réussite (${m}/${n})</span></div>
    <div class="kpi"><b>${n}</b><span>Tirs au total · ${rows.length} session${rows.length>1?'s':''}</span></div>
    <div class="kpi"><b>${best}</b><span>Plus longue série réussie</span></div>
    ${bs?`<button class="kpi btnk" data-a="opensess" data-id="${bs.s.id}" style="font:inherit;color:inherit"><b>${fmtPct(bs.m,bs.n)}</b><span>Meilleure session · ${bs.m}/${bs.n} · ${fmtDate(bs.s.date)}</span></button>`:''}</div>`;
  const pts=evolution(sh,f.range),gl=db.goals.find(g=>g.scope===f.type);
  h+=`<div class="card"><h3>Évolution</h3><div class="seg" style="max-width:260px"><button class="${f.range==='week'?'on':''}" data-a="range" data-v="week">Semaine</button><button class="${f.range==='month'?'on':''}" data-a="range" data-v="month">Mois</button></div>
    ${pts.length?lineChart(pts,gl?gl.target:null):''}
    ${pts.length<2?'<p class="cap">Continuez à enregistrer des tirs sur plusieurs '+(f.range==='week'?'semaines':'mois')+' pour voir la courbe.</p>':(gl?'<p class="cap">Ligne verte : objectif '+gl.target+NB+'%</p>':'')}</div>`;
  const all2=filtSessions(f,true),tr=shotsOf(all2.filter(s=>s.kind==='training'),f.type),ma=shotsOf(all2.filter(s=>s.kind==='match'),f.type);
  const cell=(l,a)=>`<div><span>${l}</span><b>${fmtPct(sumShots(a),a.length)}</b><span>${a.length?sumShots(a)+'/'+a.length+' tirs':'aucun tir'}</span></div>`;
  h+=`<div class="card"><h3>Entraînement vs match</h3><div class="cmp">${cell('Entraînement',tr)}${cell('Match',ma)}</div></div>`;
  const bt=agg(sh,x=>x.ty||'none');
  h+=`<div class="card"><h3>Par type de tir</h3>${Object.keys(TYPES).map(k=>barRow(TYPES[k],bt[k])).join('')}${barRow('Non précisé',bt.none)}</div>`;
  const bz=agg(sh,x=>x.z||'none');
  h+=`<div class="card"><h3>Carte de chaleur</h3>${courtSVG({heat:bz})}<div class="leg"><span>0${NB}%</span><i></i><span>100${NB}%</span></div>
    <p class="cap">Gris = aucun tir dans la zone. Pour les zones, précisez-les en mode détaillé.</p></div>`;
  h+=`<div class="card"><h3>Par zone</h3>${Object.keys(ZONES).map(k=>barRow(ZONES[k],bz[k])).join('')||''}${barRow('Non précisé',bz.none)}</div>`;
  const bsit=agg(sh.filter(x=>x.s),x=>x.s);
  if(Object.keys(bsit).length)h+=`<div class="card"><h3>Par situation</h3>${Object.keys(SITS).map(k=>barRow(SITS[k],bsit[k])).join('')}</div>`;
  return h;
}

/* ========== Vue : Accueil ========== */
function ring(p,size,sub,sm){
  const C=2*Math.PI*42,off=p==null?C:C*(1-p/100);
  return `<div class="ring${sm?' sm':''}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><circle class="rt" cx="50" cy="50" r="42"/><circle class="rv" cx="50" cy="50" r="42" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 50 50)"/></svg><div class="rl"><b>${p==null?'–':p+'<small>%</small>'}</b>${sub?`<span>${sub}</span>`:''}</div></div>`;
}
function bestStreakAll(){let best=0;for(const s of db.sessions){let c=0;for(const x of s.shots){if(x.m){c++;if(c>best)best=c}else c=0}}return best}
function homeGoals(){
  let h=`<div class="card"><div class="sh"><h3>Objectifs</h3><button data-a="tab" data-v="obj">${db.goals.length?'Gérer':'Ajouter'}</button></div>`;
  if(!db.goals.length)h+=`<p class="mut small" style="margin:0">Fixez un objectif, par exemple 75${NB}% aux lancers francs.</p>`;
  for(const g of db.goals){
    const st=goalStats(g),done=st.pl!=null&&st.pl>=g.target,prog=st.pl==null?0:Math.min(100,Math.round(st.pl/g.target*100));
    h+=`<div class="br"><div class="t"><span>${esc(GSCOPE[g.scope])}${done?' ✓':''}</span><span>${st.pl==null?'–':st.pl+NB+'%'} <em>/ ${g.target}${NB}%</em></span></div><div class="b"><i style="width:${prog}%"></i></div></div>`;
  }
  return h+'</div>';
}

function goalStats(g){
  const all=[];for(const s of db.sessions)for(const h of s.shots)if(g.scope==='all'||h.ty===g.scope)all.push({d:s.date,t:h.t,m:h.m});
  all.sort((a,b)=>a.d.localeCompare(b.d)||a.t-b.t);
  const last=all.slice(-50);
  return{n:all.length,pa:pct(sumShots(all),all.length),nl:last.length,pl:pct(sumShots(last),last.length)};
}

/* ========== CSV ========== */
const CSVH=['ligne','session_id','type_session','date','adversaire','lieu','exercice','duree_min','note_session','type_tir_defaut','horodatage','resultat','type_tir','zone','situation','objectif_portee','objectif_cible','programme_json'];
const csvCell=v=>{v=v==null?'':String(v);return /[;"\n\r,]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function buildCSV(){
  const rows=[CSVH];
  for(const s of db.sessions){
    const base=[s.id,s.kind==='match'?'Match':'Entraînement',s.date,s.opp,s.place,s.ex,durMinOf(s)==null?'':durMinOf(s),s.note,s.defType?TYPES[s.defType]:''];
    if(!s.shots.length)rows.push(['session',...base,'','','','','','','']);
    for(const h of s.shots)rows.push(['tir',...base,new Date(h.t).toISOString(),h.m?'Réussi':'Raté',h.ty?TYPES[h.ty]:'',h.z?ZONES[h.z]:'',h.s?SITS[h.s]:'','','']);
  }
  for(const g of db.goals)rows.push(['objectif','','','','','','','','','','','','','','',GSCOPE[g.scope],g.target]);
  for(const p of db.plans){const r=new Array(CSVH.length).fill('');r[0]='programme';r[CSVH.length-1]=JSON.stringify(p);rows.push(r)}
  return '\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
}
async function exportCSV(){
  if(!db.sessions.length&&!db.goals.length){toast('Rien à exporter pour le moment');return}
  const csv=buildCSV(),name='tirs-basket-'+todayISO()+'.csv';
  try{const file=new File([csv],name,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Mes tirs de basket'});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Fichier CSV exporté');
}
function parseCSV(t,d){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows;
}
const rev=map=>{const o={};for(const k in map)o[map[k].toLowerCase()]=k;return o};
function importCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/,1)[0],delim=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
  const rows=parseCSV(text,delim);if(rows.length<2)throw new Error('Fichier vide');
  const hdr=rows[0].map(x=>x.trim().toLowerCase()),ix={};hdr.forEach((h,i)=>ix[h]=i);
  if(ix.ligne==null)throw new Error('Format non reconnu (colonne « ligne » absente)');
  const get=(r,k)=>ix[k]==null?'':(r[ix[k]]||'').trim();
  const rT=rev(TYPES),rZ=rev(ZONES),rS=rev(SITS),rG=rev(GSCOPE);
  const pickT=v=>{v=v.toLowerCase();return rT[v]||(TYPES[v]?v:null)};
  const map=new Map();let nShots=0,nGoals=0,nProg=0;
  for(const r of rows.slice(1)){
    const kind=get(r,'ligne').toLowerCase();
    if(kind==='programme'){
      try{const p=JSON.parse(get(r,'programme_json'));
        if(p&&p.id&&Array.isArray(p.ex)&&p.ex.length){
          const q={id:String(p.id),name:String(p.name||'Programme'),ex:p.ex.map(e=>({zone:ZONES[e.zone]?e.zone:'',ty:TYPES[e.ty]?e.ty:'',sit:SITS[e.sit]?e.sit:'',target:Math.max(1,parseInt(e.target,10)||1),name:String(e.name||'')}))};
          db.plans=db.plans.filter(x=>x.id!==q.id);db.plans.push(q);nProg++}}catch(e){}
      continue;
    }
    if(kind==='objectif'){
      const sc=rG[get(r,'objectif_portee').toLowerCase()]||(GSCOPE[get(r,'objectif_portee')]?get(r,'objectif_portee'):null),tg=parseInt(get(r,'objectif_cible'),10);
      if(sc&&tg>0&&tg<=100){db.goals=db.goals.filter(g=>g.scope!==sc);db.goals.push({scope:sc,target:tg});nGoals++}
      continue;
    }
    if(kind!=='tir'&&kind!=='session')continue;
    const sid=get(r,'session_id')||('imp-'+get(r,'date')+'-'+get(r,'exercice')+get(r,'adversaire'));
    let s=map.get(sid);
    if(!s){const d=get(r,'date'),dm=parseInt(get(r,'duree_min'),10);
      s={id:sid.startsWith('imp-')?uid():sid,kind:/match/i.test(get(r,'type_session'))?'match':'training',date:/^\d{4}-\d{2}-\d{2}$/.test(d)?d:todayISO(),createdAt:Date.now()+map.size,
        opp:get(r,'adversaire'),place:get(r,'lieu'),ex:get(r,'exercice'),durMin:dm>0?dm:null,note:r[ix.note_session]||'',defType:pickT(get(r,'type_tir_defaut')),
        status:'done',elapsed:(dm>0?dm:0)*60000,segStart:null,lastTick:0,shots:[]};
      map.set(sid,s)}
    if(kind==='tir'){
      const res=get(r,'resultat'),ts=Date.parse(get(r,'horodatage'));
      s.shots.push({t:isNaN(ts)?Date.now():ts,m:/ussi/i.test(res)||res==='1'?1:0,ty:pickT(get(r,'type_tir')),z:rZ[get(r,'zone').toLowerCase()]||(ZONES[get(r,'zone')]?get(r,'zone'):null),s:rS[get(r,'situation').toLowerCase()]||null});nShots++;
    }
  }
  let nS=0;
  for(const s of map.values()){
    if(s.id===db.activeId)continue;
    s.shots.sort((a,b)=>a.t-b.t);
    db.sessions=db.sessions.filter(x=>x.id!==s.id);db.sessions.push(s);nS++;
  }
  save();
  return{nS,nShots,nGoals,nProg};
}
