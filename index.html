<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes tirs – Basket</title>
<meta name="description" content="Suivi de tirs de basket : saisie rapide, statistiques et objectifs.">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f16" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes tirs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light dark;
--bg:#f3f5f8;--surface:#fff;--surface2:#e8edf2;--text:#0b1320;--muted:#566275;--line:#cdd6e0;
--accent:#d9480f;--accent-t:#fff;--ok:#15803d;--ko:#b91c1c;--okbg:#bbf7d0;--kobg:#fecaca;
--zs:#f6eedb;--cline:#6b5d45;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f16;--surface:#141c26;--surface2:#1e2835;--text:#f2f6fb;--muted:#9fb0c4;--line:#2b384a;
--accent:#fb923c;--accent-t:#1a1206;--ok:#16a34a;--ko:#dc2626;--okbg:#14532d;--kobg:#7f1d1d;--zs:#243244;--cline:#8fa4bd}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;background:var(--bg);color:var(--text);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
h2,h3{margin:0}
h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px}
h3:first-child{margin-top:0}
.mut{color:var(--muted)}.small{font-size:13px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top);background:var(--bg)}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 16px;min-height:56px}
#hdr h1{margin:0;font-size:24px;font-weight:800}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 14px 24px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{min-height:60px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.btn{min-height:48px;min-width:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-t);border-color:transparent}
.btn.danger{color:var(--ko);border-color:var(--ko)}
.btn.block{display:flex;width:100%;margin-top:10px}
.btn.xl{min-height:60px;font-size:19px}
.btn.ico{border:0;background:none;padding:0;width:48px;font-size:22px}
.btn:active,.chip:active{filter:brightness(.92)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.sw{position:relative;width:60px;height:34px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0}
.sw i{position:absolute;inset:0;border-radius:20px;background:var(--line);transition:.15s}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(26px)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:17px;-webkit-user-select:text;user-select:text}
textarea{min-height:76px;resize:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{min-height:52px;border:0;border-radius:11px;background:none;font-weight:800;font-size:16px}
.seg button.on{background:var(--accent);color:var(--accent-t)}
.seg button.on.okc{background:var(--ok);color:#fff}.seg button.on.koc{background:var(--ko);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:26px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips.scroll .chip{flex:none}
.cap{margin:8px 0 0;font-size:14px;color:var(--muted);text-align:center}
/* live */
#live{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px 4px}
#live.f-ok{animation:fok .5s}#live.f-ko{animation:fko .5s}
@keyframes fok{0%{background:var(--okbg)}100%{background:var(--surface)}}
@keyframes fko{0%{background:var(--kobg)}100%{background:var(--surface)}}
.lv-top{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--text)}
.tag{padding:2px 9px;border-radius:10px;font-weight:800;font-size:11px;background:var(--surface2);color:var(--text);letter-spacing:.03em}
.tag.pz{background:var(--accent);color:var(--accent-t)}
.tm{font-variant-numeric:tabular-nums;font-weight:800;color:var(--text)}
.lv-main{text-align:center;font-size:46px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;margin:2px 0 0}
.lv-sub{text-align:center;font-size:14px;color:var(--muted)}
.lv-sub b{color:var(--text)}
.dots{display:flex;overflow-x:auto;min-height:48px;align-items:center;scrollbar-width:none}
.dots.wrap{flex-wrap:wrap;overflow:visible}
.dot{flex:none;width:38px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.d{width:26px;height:26px;border-radius:50%;display:block;font-style:normal;font-weight:800;font-size:14px;line-height:26px;text-align:center;color:#fff}
.d.ok{background:var(--ok)}.d.ko{background:var(--ko)}
#actions{background:var(--surface);border-top:1px solid var(--line);padding:8px 12px 10px}
.undo{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);font-weight:700;font-size:15px;margin-bottom:8px}
.undo:disabled{opacity:.45}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{height:clamp(88px,15vh,130px);height:clamp(88px,15dvh,130px);border:0;border-radius:20px;color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.shot.ok{background:var(--ok)}.shot.ko{background:var(--ko)}
.shot:active{transform:scale(.97);filter:brightness(1.18)}
.resume{width:100%;height:clamp(88px,15vh,130px);border:0;border-radius:20px;background:var(--accent);color:var(--accent-t);font-size:26px;font-weight:800}
/* court */
.court{display:block;width:100%;max-width:440px;margin:0 auto;border-radius:12px;background:var(--zs)}
.court .z{fill:var(--zs);stroke:var(--cline);stroke-opacity:.55;stroke-width:1}
.court .z[data-a]{cursor:pointer}
.court .z.sel{fill:var(--accent);stroke-opacity:1;stroke-width:2}
.court .cl{fill:none;stroke:var(--cline);stroke-width:2;pointer-events:none}
.court .cl.d{stroke-dasharray:4 4;stroke-width:1.5;opacity:.7}
.court .rim{fill:none;stroke:var(--accent);stroke-width:2.5;pointer-events:none}
.court .hint{fill:var(--muted);font-size:10px;font-weight:700;text-anchor:middle;pointer-events:none}
.hl{fill:#fff;font-weight:800;font-size:12px;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.65);stroke-width:2.5px;pointer-events:none}
.hl.n{font-size:9px;font-weight:700}
.leg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.leg i{flex:1;height:10px;border-radius:6px;background:linear-gradient(90deg,hsl(0,72%,40%),hsl(60,72%,40%),hsl(120,72%,40%))}
/* lists / stats */
.scard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;min-height:72px}
.scard .l1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scard .t{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .sc{font-weight:800;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.scard .s{font-size:13px;color:var(--muted);margin-top:2px}
.mh{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:16px 4px 8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.btnk{text-align:left}
.br{margin:12px 0}
.br .t{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:700}
.br .t em{font-style:normal;color:var(--muted);font-weight:600}
.br .b{height:12px;background:var(--surface2);border-radius:8px;overflow:hidden;margin-top:5px}
.br .b i{display:block;height:100%;border-radius:8px}
svg.ch{display:block;width:100%;height:auto}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .ax{fill:var(--muted);font-size:10px}
.ch .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ch .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch .pv{fill:var(--text);font-size:10px;font-weight:700;text-anchor:middle}
.ch .goal{stroke:var(--ok);stroke-width:2;stroke-dasharray:6 4}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.cmp b{display:block;font-size:30px;font-weight:800}
.cmp span{font-size:13px;color:var(--muted)}
.gbar{height:16px;background:var(--surface2);border-radius:10px;overflow:hidden;margin:10px 0 6px}
.gbar i{display:block;height:100%;background:var(--accent);border-radius:10px}
.gbar i.done{background:var(--ok)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
/* sheets */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pn{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:0 14px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ph{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:8px 0 6px}
.ph h2{font-size:21px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-20px);background:#111;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <section id="live" hidden></section>
  <main id="main"></main>
  <div id="actions" hidden></div>
  <nav aria-label="Navigation">
    <button data-a="tab" data-v="saisie"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6c3 2.6 3 10.2 0 12.8M18.4 5.6c-3 2.6-3 10.2 0 12.8"/></svg>Saisie</button>
    <button data-a="tab" data-v="histo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button>
    <button data-a="tab" data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
    <button data-a="tab" data-v="obj"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Objectifs</button>
  </nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status"></div>
<input type="file" id="fi" accept=".csv,text/csv,text/plain" hidden>

<script>
'use strict';
/* ========== Utilitaires ========== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const parseISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const fmtDate=s=>parseISO(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const NB='\u00A0';
const pct=(m,n)=>n?Math.round(100*m/n):null;
const fmtPct=(m,n)=>n?pct(m,n)+NB+'%':'–'+NB+'%';
const heat=p=>'hsl('+Math.round(p*1.2)+',72%,40%)';
const fmtDur=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+pad(m):m)+':'+pad(s)};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

/* ========== Constantes ========== */
const TYPES={ft:'Lancer franc','2':'2 points','3':'3 points',layup:'Layup',mid:'Mi-distance'};
const ZONES={paint:'Raquette',ft:'Lancer franc',mid_l:'Mi-distance gauche',mid_c:'Mi-distance centre',mid_r:'Mi-distance droite',corner_l:'Corner gauche',corner_r:'Corner droit',wing_l:'3 pts aile gauche',axis:'3 pts axe',wing_r:'3 pts aile droite'};
const SITS={arret:'Tir arrêté',mvt:'En mouvement',press:'Sous pression',passe:'Sur passe',dribble:'Après dribble'};
const ZT={ft:['ft'],paint:['2','layup'],mid_l:['2','mid'],mid_c:['2','mid'],mid_r:['2','mid'],corner_l:['3'],corner_r:['3'],wing_l:['3'],axis:['3'],wing_r:['3']};
const LBL={paint:[150,52],ft:[150,96],mid_l:[78,80],mid_c:[150,128],mid_r:[222,80],corner_l:[22,56],corner_r:[278,56],wing_l:[45,160],axis:[150,185],wing_r:[255,160]};
const GSCOPE=Object.assign({all:'Global'},TYPES);

/* ========== Données ========== */
const KEY='tirsBasket.v1';
const defDB=()=>({v:1,sessions:[],goals:[],activeId:null,settings:{detailed:false,layup:false,mid:false},sel:{ty:'2',z:null,s:null}});
function loadDB(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw),b=defDB();
    return Object.assign(b,d,{settings:Object.assign(b.settings,d.settings||{}),sel:Object.assign(b.sel,d.sel||{})});}}catch(e){}
  return defDB();
}
let db=loadDB();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠ Stockage plein ou indisponible')}}
const active=()=>db.sessions.find(s=>s.id===db.activeId&&s.status!=='done')||null;
const sessById=id=>db.sessions.find(s=>s.id===id);
const enabledTypes=()=>['ft','2','3'].concat(db.settings.layup?['layup']:[],db.settings.mid?['mid']:[]);
function fixSel(){const en=enabledTypes();if(!en.includes(db.sel.ty)){db.sel.ty='2';if(db.sel.z&&!ZT[db.sel.z].includes('2'))db.sel.z=null}}
const elapsedMs=s=>(s.elapsed||0)+(s.status==='active'&&s.segStart?Date.now()-s.segStart:0);
const durMinOf=s=>s.durMin!=null?s.durMin:(s.elapsed>0?Math.max(1,Math.round(s.elapsed/60000)):null);
const titleOf=s=>s.kind==='match'?(s.opp?'Match vs '+s.opp:'Match'):(s.ex||'Entraînement');
const sumShots=a=>a.reduce((x,h)=>x+h.m,0);
(function recover(){const s=active();if(!s||s.status!=='active')return;const now=Date.now(),last=s.lastTick||s.segStart||now;
  s.elapsed=(s.elapsed||0)+Math.max(0,last-(s.segStart||last));
  if(now-last<15*60000){s.segStart=now;s.lastTick=now}else{s.segStart=null;s.status='paused'}
  if(!active()||s.status==='done')db.activeId=null;fixSel();save();})();

/* ========== État UI ========== */
const ui={tab:'saisie',lastTab:null,sheets:[],flash:null,
  form:{kind:'training',date:todayISO(),dt:0,opp:'',place:'',ex:'',dur:'',defType:'',note:''},
  st:{period:'all',kind:'all',type:'all',range:'week'}};
const topSheet=()=>ui.sheets[ui.sheets.length-1];

/* ========== Écran de veille / vibration ========== */
let wl=null;
async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function release(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{const s=active();
  if(document.hidden){if(s&&s.status==='active'){s.lastTick=Date.now();save()}}
  else if(s&&s.status==='active')wake()});
window.addEventListener('pagehide',()=>{const s=active();if(s&&s.status==='active'){s.lastTick=Date.now();save()}});

/* ========== Logique de saisie ========== */
function applyZone(d,z){
  if(d.z===z){d.z=null;return}
  d.z=z;const ok=ZT[z];
  if(!ok.includes(d.ty)){d.ty=z==='ft'?'ft':ok[0]==='3'?'3':z==='paint'?(db.settings.layup?'layup':'2'):(db.settings.mid?'mid':'2')}
}
function applyType(d,t,toggle){
  if(toggle&&d.ty===t){d.ty=null;return}
  d.ty=t;if(t==='ft')d.z='ft';else if(d.z&&!ZT[d.z].includes(t))d.z=null;
}
function startSession(){
  const f=ui.form,kind=f.kind;
  const s={id:uid(),kind,date:f.date||todayISO(),createdAt:Date.now(),opp:kind==='match'?f.opp.trim():'',place:kind==='match'?f.place.trim():'',
    ex:kind==='training'?f.ex.trim():'',durMin:kind==='training'&&f.dur!==''?Math.max(1,parseInt(f.dur,10)||1):null,note:f.note.trim(),
    defType:kind==='training'&&f.defType?f.defType:null,shots:[],status:'active',elapsed:0,segStart:Date.now(),lastTick:Date.now()};
  db.sessions.push(s);db.activeId=s.id;
  if(s.defType){applyType(db.sel,s.defType,false)}
  ui.form.opp='';ui.form.place='';ui.form.note='';ui.form.dur='';ui.form.dt=0;
  save();wake();refresh();
}
function addShot(made){
  const s=active();if(!s||s.status!=='active')return;
  let ty=null,z=null,si=null;
  if(db.settings.detailed){ty=db.sel.ty;z=db.sel.z;si=db.sel.s}
  else{ty=s.defType||null;if(ty==='ft')z='ft'}
  s.shots.push({t:Date.now(),m:made?1:0,ty,z,s:si});
  s.lastTick=Date.now();ui.flash=made?'ok':'ko';
  buzz(made?25:[18,30,18]);save();wake();refresh();
}
function undoShot(){
  const s=active();if(!s||!s.shots.length)return;
  const h=s.shots.pop();save();buzz(15);toast('Dernier tir annulé ('+(h.m?'réussi':'raté')+')');refresh();
}
function pauseS(){const s=active();if(!s||s.status!=='active')return;s.elapsed=elapsedMs(s);s.segStart=null;s.status='paused';save();release();refresh()}
function resumeS(){const s=active();if(!s||s.status!=='paused')return;s.status='active';s.segStart=Date.now();s.lastTick=Date.now();save();wake();refresh()}
function finishS(){
  const s=active();if(!s)return;
  if(!s.shots.length){if(confirm('Aucun tir enregistré. Supprimer cette session ?')){db.sessions=db.sessions.filter(x=>x!==s);db.activeId=null;save();release();refresh();toast('Session supprimée')}return}
  if(!confirm('Terminer la session ?\n'+sumShots(s.shots)+'/'+s.shots.length+' – '+fmtPct(sumShots(s.shots),s.shots.length)))return;
  s.elapsed=elapsedMs(s);s.segStart=null;s.status='done';db.activeId=null;save();release();
  ui.tab='histo';refresh();toast('Session terminée ✓');
}

/* ========== Filtres / statistiques ========== */
const cutoffISO=days=>{const d=new Date();d.setDate(d.getDate()-days);return isoOf(d)};
function filtSessions(f,ignoreKind){
  const cut=f.period==='all'?null:cutoffISO(+f.period);
  return db.sessions.filter(s=>(!cut||s.date>=cut)&&(ignoreKind||f.kind==='all'||s.kind===f.kind));
}
function shotsOf(sessions,type){
  const out=[];for(const s of sessions)for(const h of s.shots)if(type==='all'||h.ty===type)out.push({t:h.t,m:h.m,ty:h.ty,z:h.z,s:h.s,sid:s.id,kind:s.kind,date:s.date});
  return out;
}
function agg(shots,keyFn){const o={};for(const h of shots){const k=keyFn(h);if(!o[k])o[k]={m:0,n:0};o[k].n++;o[k].m+=h.m}return o}
const weekKey=ds=>{const d=parseISO(ds);d.setDate(d.getDate()-(d.getDay()+6)%7);return isoOf(d)};
function barRow(label,a){
  if(!a||!a.n)return '';
  const p=pct(a.m,a.n);
  return `<div class="br"><div class="t"><span>${esc(label)}</span><span>${p}${NB}% <em>(${a.m}/${a.n})</em></span></div><div class="b"><i style="width:${p}%;background:${heat(p)}"></i></div></div>`;
}

/* ========== Rendu : terrain ========== */
function courtSVG(o){
  const R=125,cy=34+Math.sqrt(R*R-105*105);
  const P=(g,r)=>{const a=g*Math.PI/180;return[150+r*Math.sin(a),34+r*Math.cos(a)]};
  const f=n=>n.toFixed(1);
  const QL=P(-25,R),QR=P(25,R),W1=P(-90,600),W2=P(-25,600),W3=P(25,600),W4=P(90,600);
  const cyS=f(cy);
  const shapes=[
    ['wing_l',`M150,34L${f(W1[0])},${f(W1[1])}L${f(W2[0])},${f(W2[1])}Z`],
    ['axis',`M150,34L${f(W2[0])},${f(W2[1])}L${f(W3[0])},${f(W3[1])}Z`],
    ['wing_r',`M150,34L${f(W3[0])},${f(W3[1])}L${f(W4[0])},${f(W4[1])}Z`],
    ['corner_l',`M0,6H45V${cyS}H0Z`],
    ['corner_r',`M255,6H300V${cyS}H255Z`],
    ['mid_l',`M45,6V${cyS}A${R},${R} 0 0 0 ${f(QL[0])},${f(QL[1])}L150,34V6Z`],
    ['mid_c',`M${f(QL[0])},${f(QL[1])}A${R},${R} 0 0 0 ${f(QR[0])},${f(QR[1])}L150,34Z`],
    ['mid_r',`M255,6V${cyS}A${R},${R} 0 0 1 ${f(QR[0])},${f(QR[1])}L150,34V6Z`],
    ['paint','M108,6H192V96H108Z']
  ];
  const attrs=id=>{
    let a=`class="z${o.sel===id?' sel':''}"`;
    if(o.act)a+=` data-a="${o.act}" data-z="${id}"`;
    if(o.heat&&o.heat[id]&&o.heat[id].n)a+=` style="fill:${heat(pct(o.heat[id].m,o.heat[id].n))}"`;
    return a;
  };
  let h=`<svg class="court" viewBox="0 6 300 210" role="img" aria-label="Demi-terrain">`;
  for(const [id,d] of shapes)h+=`<path ${attrs(id)} d="${d}"/>`;
  h+=`<circle ${attrs('ft')} cx="150" cy="96" r="20"/>`;
  h+=`<path class="cl" d="M108,6V96H192V6"/><path class="cl" d="M114,96A36,36 0 0 0 186,96"/><path class="cl d" d="M114,96A36,36 0 0 1 186,96"/>`;
  h+=`<path class="cl" d="M45,6V${cyS}A${R},${R} 0 0 0 255,${cyS}V6"/><rect class="cl" x="0" y="6" width="300" height="210"/>`;
  h+=`<path class="cl" d="M138,25H162"/><circle class="rim" cx="150" cy="34" r="6"/>`;
  if(o.heat){
    for(const id in LBL){const a=o.heat[id];if(!a||!a.n)continue;const [x,y]=LBL[id];
      h+=id==='ft'?`<text class="hl" x="${x}" y="${y-1}" style="font-size:11px">${pct(a.m,a.n)}%</text><text class="hl n" x="${x}" y="${y+10}">${a.n}</text>`
        :`<text class="hl" x="${x}" y="${y}">${pct(a.m,a.n)}%</text><text class="hl n" x="${x}" y="${y+12}">${a.n} tir${a.n>1?'s':''}</text>`;}
  }else h+=`<text class="hint" x="150" y="99" style="font-size:9px;fill:var(--cline)">LF</text>`;
  return h+'</svg>';
}

const sw=(k,t,sub)=>`<label class="row"><span><b>${t}</b><br><small class="mut">${sub}</small></span><span class="sw"><input type="checkbox" data-c="set" data-k="${k}" ${db.settings[k]?'checked':''}><i></i></span></label>`;
function typeChips(cur,act){const it=enabledTypes();if(cur&&!it.includes(cur))it.push(cur);

function detailCard(){

function liveBar(s){
  const n=s.shots.length,m=sumShots(s.shots);
  let cur=0;for(let i=n-1;i>=0&&s.shots[i].m;i--)cur++;
  let best=0,c=0;for(const h of s.shots){if(h.m){c++;if(c>best)best=c}else c=0}
  const dots=s.shots.map((h,i)=>({h,i})).slice(-30).map(({h,i})=>`<button class="dot" data-a="dot" data-i="${i}" aria-label="Modifier le tir ${i+1}"><i class="d ${h.m?'ok':'ko'}">${h.m?'✓':'✕'}</i></button>`).join('');
  return `<div class="lv-top"><span class="tag">${s.kind==='match'?'MATCH':'ENTRAÎNEMENT'}</span><span class="ttl">${esc(titleOf(s))}</span>${s.status==='paused'?'<span class="tag pz">PAUSE</span>':''}<span class="tm" id="tm">${fmtDur(elapsedMs(s))}</span></div>

function actionsBar(s){

/* ========== Vue : Historique ========== */
function viewHisto(){
  const list=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);

/* ========== Vue : Stats ========== */
function lineChart(pts,goal){
  const W=320,H=190,L=34,Rr=12,T=14,Bm=30,iw=W-L-Rr,ih=H-T-Bm;
  const X=i=>L+(pts.length===1?iw/2:iw*i/(pts.length-1)),Y=p=>T+ih*(1-p/100);
  let g='';
  [0,25,50,75,100].forEach(v=>{g+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`});
  if(goal!=null)g+=`<line class="goal" x1="${L}" x2="${W-Rr}" y1="${Y(goal)}" y2="${Y(goal)}"/>`;
  g+=`<path class="ln" d="${pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.p).toFixed(1)).join('')}"/>`;
  const step=Math.ceil(pts.length/6);
  pts.forEach((p,i)=>{
    g+=`<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.p).toFixed(1)}" r="4.5"><title>${p.p}% (${p.m}/${p.n})</title></circle>`;
    if(pts.length<=8)g+=`<text class="pv" x="${X(i).toFixed(1)}" y="${(Y(p.p)-9).toFixed(1)}">${p.p}%</text>`;
    if(i%step===0||i===pts.length-1)g+=`<text class="ax" x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du pourcentage de réussite">${g}</svg>`;
}
function evolution(sh,range){
  const o=agg(sh,h=>range==='week'?weekKey(h.date):h.date.slice(0,7));
  return Object.keys(o).sort().slice(-12).map(k=>{
    const label=range==='week'?parseISO(k).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}):parseISO(k+'-01').toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});
    return{k,label,m:o[k].m,n:o[k].n,p:pct(o[k].m,o[k].n)};
  });
}
function viewStats(){
  if(!db.sessions.length)return `<div class="empty"><b>Pas encore de statistiques</b>Enregistrez quelques tirs pour voir apparaître vos pourcentages, la carte de chaleur et votre progression.</div>`;
  const f=ui.st,sess=filtSessions(f),sh=shotsOf(sess,f.type),n=sh.length,m=sumShots(sh);
  const chip=(k,v,l)=>`<button class="chip${f[k]===v?' on':''}" data-a="stf" data-k="${k}" data-v="${v}">${l}</button>`;
  const typesAvail=Object.keys(TYPES).filter(k=>enabledTypes().includes(k)||shotsOf(db.sessions,k).length);
  let h=`<div class="card"><h3>Période</h3><div class="chips scroll">${chip('period','7','7 jours')}${chip('period','30','30 jours')}${chip('period','90','90 jours')}${chip('period','all','Tout')}</div>
    <h3>Session</h3><div class="chips scroll">${chip('kind','all','Toutes')}${chip('kind','training','Entraînement')}${chip('kind','match','Match')}</div>
    <h3>Type de tir</h3><div class="chips scroll">${chip('type','all','Tous')}${typesAvail.map(k=>chip('type',k,TYPES[k])).join('')}</div></div>`;
  if(!n)return h+`<div class="empty"><b>Aucun tir pour ces filtres</b>Élargissez la période ou changez de type.</div>`;
  let best=0;
  for(const s of sess){let c=0;for(const x of s.shots){if(f.type!=='all'&&x.ty!==f.type)continue;if(x.m){c++;if(c>best)best=c}else c=0}}
  const rows=sess.map(s=>{const hs=s.shots.filter(x=>f.type==='all'||x.ty===f.type);return{s,n:hs.length,m:sumShots(hs)}}).filter(r=>r.n>0);
  const pool=rows.filter(r=>r.n>=10),cand=(pool.length?pool:rows).sort((a,b)=>b.m/b.n-a.m/a.n||b.n-a.n),bs=cand[0];
  h+=`<div class="kpis">
    <div class="kpi"><b style="color:${heat(pct(m,n))}">${fmtPct(m,n)}</b><span>Réussite (${m}/${n})</span></div>
    <div class="kpi"><b>${n}</b><span>Tirs au total · ${rows.length} session${rows.length>1?'s':''}</span></div>
    <div class="kpi"><b>${best}</b><span>Plus longue série réussie</span></div>
    ${bs?`<button class="kpi btnk" data-a="opensess" data-id="${bs.s.id}" style="font:inherit;color:inherit"><b>${fmtPct(bs.m,bs.n)}</b><span>Meilleure session · ${bs.m}/${bs.n} · ${fmtDate(bs.s.date)}</span></button>`:''}</div>`;
  const pts=evolution(sh,f.range),gl=db.goals.find(g=>g.scope===f.type);
  h+=`<div class="card"><h3>Évolution</h3><div class="seg" style="max-width:260px"><button class="${f.range==='week'?'on':''}" data-a="range" data-v="week">Semaine</button><button class="${f.range==='month'?'on':''}" data-a="range" data-v="month">Mois</button></div>
    ${pts.length?lineChart(pts,gl?gl.target:null):''}
    ${pts.length<2?'<p class="cap">Continuez à enregistrer des tirs sur plusieurs '+(f.range==='week'?'semaines':'mois')+' pour voir la courbe.</p>':(gl?'<p class="cap">Ligne verte : objectif '+gl.target+NB+'%</p>':'')}</div>`;
  const all2=filtSessions(f,true),tr=shotsOf(all2.filter(s=>s.kind==='training'),f.type),ma=shotsOf(all2.filter(s=>s.kind==='match'),f.type);
  const cell=(l,a)=>`<div><span>${l}</span><b ${a.length?`style="color:${heat(pct(sumShots(a),a.length))}"`:''}>${fmtPct(sumShots(a),a.length)}</b><span>${a.length?sumShots(a)+'/'+a.length+' tirs':'aucun tir'}</span></div>`;
  h+=`<div class="card"><h3>Entraînement vs match</h3><div class="cmp">${cell('Entraînement',tr)}${cell('Match',ma)}</div></div>`;
  const bt=agg(sh,x=>x.ty||'none');
  h+=`<div class="card"><h3>Par type de tir</h3>${Object.keys(TYPES).map(k=>barRow(TYPES[k],bt[k])).join('')}${barRow('Non précisé',bt.none)}</div>`;
  const bz=agg(sh,x=>x.z||'none');
  h+=`<div class="card"><h3>Carte de chaleur</h3>${courtSVG({heat:bz})}<div class="leg"><span>0${NB}%</span><i></i><span>100${NB}%</span></div>
    <p class="cap">Gris = aucun tir dans la zone. Pour les zones, précisez-les en mode détaillé.</p></div>`;
  h+=`<div class="card"><h3>Par zone</h3>${Object.keys(ZONES).map(k=>barRow(ZONES[k],bz[k])).join('')||''}${barRow('Non précisé',bz.none)}</div>`;
  const bsit=agg(sh.filter(x=>x.s),x=>x.s);
  if(Object.keys(bsit).length)h+=`<div class="card"><h3>Par situation</h3>${Object.keys(SITS).map(k=>barRow(SITS[k],bsit[k])).join('')}</div>`;
  return h;
}

/* ========== Vue : Objectifs ========== */
function goalStats(g){
  const all=[];for(const s of db.sessions)for(const h of s.shots)if(g.scope==='all'||h.ty===g.scope)all.push({d:s.date,t:h.t,m:h.m});
  all.sort((a,b)=>a.d.localeCompare(b.d)||a.t-b.t);
  const last=all.slice(-50);
  return{n:all.length,pa:pct(sumShots(all),all.length),nl:last.length,pl:pct(sumShots(last),last.length)};
}
function viewObj(){
  let h=`<p class="mut small" style="margin:0 4px 12px">La progression est calculée sur vos 50 derniers tirs de la catégorie.</p>`;
  if(!db.goals.length)h+=`<div class="empty"><b>Aucun objectif</b>Par exemple : 75${NB}% aux lancers francs ou 35${NB}% à 3 points.</div>`;
  for(const g of db.goals){
    const s=goalStats(g),done=s.pl!=null&&s.pl>=g.target,prog=s.pl==null?0:Math.min(100,Math.round(s.pl/g.target*100));
    const msg=s.pl==null?'Pas encore de tirs dans cette catégorie':done?'Objectif atteint 🎉':'Encore '+(g.target-s.pl)+' point'+(g.target-s.pl>1?'s':'')+' à gagner';
    h+=`<button class="scard" data-a="editgoal" data-scope="${g.scope}"><div class="l1"><span class="t">${esc(GSCOPE[g.scope])}</span><span class="sc">Objectif ${g.target}${NB}%</span></div>
      <div class="gbar"><i class="${done?'done':''}" style="width:${prog}%"></i></div>
      <div class="s"><b style="color:var(--text)">${s.pl==null?'–':s.pl+NB+'%'}</b> sur les ${s.nl} derniers tirs${s.pa!=null?' · depuis le début : '+s.pa+NB+'% ('+s.n+' tirs)':''}</div>
      <div class="s" style="font-weight:700;${done?'color:var(--ok)':''}">${msg}${s.nl&&s.nl<20?' (échantillon réduit)':''}</div></button>`;
  }
  return h+`<button class="btn pri block xl" data-a="addgoal">＋ Nouvel objectif</button>`;
}

function sheetHTML(o){
  if(o.k==='settings'){
    const nS=db.sessions.length,nT=db.sessions.reduce((a,s)=>a+s.shots.length,0);
    return `<div class="ph"><h2>Réglages</h2>${closeBtn()}</div>
    <div class="card">${sw('detailed','Mode détaillé','Type, zone et situation de chaque tir')}${sw('layup','Type « Layup »','Ajoute ce type de tir')}${sw('mid','Type « Mi-distance »','Ajoute ce type de tir')}</div>
    <div class="card"><h3>Mes données</h3><p class="mut small" style="margin:0">Stockées uniquement sur ce téléphone, sans compte : ${nS} session${nS>1?'s':''}, ${nT} tir${nT>1?'s':''}.</p>
      <button class="btn block" data-a="export">⬆ Exporter en CSV</button><button class="btn block" data-a="import">⬇ Importer un CSV</button>
      <button class="btn block danger" data-a="wipe">Tout effacer</button></div>`;
  }
  if(o.k==='sess'){
    const s=sessById(o.id);if(!s)return `<div class="ph"><h2>Session introuvable</h2>${closeBtn()}</div>`;
    const n=s.shots.length,m=sumShots(s.shots),isAct=s.id===db.activeId&&s.status!=='done',d=durMinOf(s);
    const dots=s.shots.map((h,i)=>`<button class="dot" data-a="shotedit" data-sid="${s.id}" data-i="${i}" aria-label="Modifier le tir ${i+1}"><i class="d ${h.m?'ok':'ko'}">${h.m?'✓':'✕'}</i></button>`).join('');
    const types=Object.keys(TYPES).map(k=>`<option value="${k}"${s.defType===k?' selected':''}>${TYPES[k]}</option>`).join('');
    return `<div class="ph"><h2>${esc(titleOf(s))}</h2>${closeBtn()}</div>
    <div class="card" style="text-align:center"><div style="font-size:40px;font-weight:800">${m}/${n} – ${fmtPct(m,n)}</div><div class="mut small">${fmtDate(s.date)}${d?' · '+d+' min':''}</div></div>
    <div class="card"><h3>Tirs (touchez pour modifier)</h3>${n?`<div class="dots wrap">${dots}</div>`:'<p class="mut small">Aucun tir.</p>'}
      ${isAct?'':`<div class="shots" style="margin-top:8px"><button class="btn" data-a="addshot" data-m="1" data-id="${s.id}">＋ Réussi</button><button class="btn" data-a="addshot" data-m="0" data-id="${s.id}">＋ Raté</button></div>`}</div>
    <div class="card"><h3>Informations</h3>
      <div class="seg"><button class="${s.kind==='training'?'on':''}" data-a="skind" data-v="training" data-id="${s.id}">Entraînement</button><button class="${s.kind==='match'?'on':''}" data-a="skind" data-v="match" data-id="${s.id}">Match</button></div>
      <label class="fld"><span>Date</span><input type="date" data-c="sf" data-id="${s.id}" data-k="date" value="${esc(s.date)}"></label>
      ${s.kind==='match'?`<label class="fld"><span>Adversaire</span><input type="text" data-c="sf" data-id="${s.id}" data-k="opp" value="${esc(s.opp)}" autocomplete="off"></label>
        <label class="fld"><span>Lieu</span><input type="text" data-c="sf" data-id="${s.id}" data-k="place" value="${esc(s.place)}" autocomplete="off"></label>`
      :`<label class="fld"><span>Exercice</span><input type="text" data-c="sf" data-id="${s.id}" data-k="ex" value="${esc(s.ex)}" autocomplete="off"></label>
        <label class="fld"><span>Durée (minutes)</span><input type="number" inputmode="numeric" min="1" data-c="sf" data-id="${s.id}" data-k="durMin" value="${d!=null?d:''}"></label>
        <label class="fld"><span>Type de tir de l'exercice</span><select data-c="sf" data-id="${s.id}" data-k="defType"><option value="">Non précisé</option>${types}</select></label>`}
      <label class="fld"><span>Note</span><textarea data-c="sf" data-id="${s.id}" data-k="note" rows="3">${esc(s.note)}</textarea></label></div>
    ${isAct?`<button class="btn pri block" data-a="gosaisie">Retourner à la saisie</button>`
      :(db.activeId&&active()?'':`<button class="btn block" data-a="reopen" data-id="${s.id}">▶ Reprendre cette session</button>`)}
    <button class="btn block danger" data-a="delsess" data-id="${s.id}">Supprimer la session</button>`;
  }
  if(o.k==='shot'){
    const d=o.d;
    return `<div class="ph"><h2>Modifier le tir ${o.i+1}</h2>${closeBtn()}</div>
    <div class="seg"><button class="${d.m?'on okc':''}" data-a="sh-res" data-v="1">✓ Réussi</button><button class="${!d.m?'on koc':''}" data-a="sh-res" data-v="0">✕ Raté</button></div>
    <div class="card"><h3>Type de tir</h3><div class="chips">${typeChips(d.ty,'sh-type')}</div>
    <h3>Zone du terrain</h3>${courtSVG({act:'sh-zone',sel:d.z})}<p class="cap">${d.z?`Zone : <b>${ZONES[d.z]}</b>`:'Zone non précisée'}</p>
    <h3>Situation</h3><div class="chips">${sitChips(d.s,'sh-sit')}</div></div>
    <button class="btn pri block xl" data-a="sh-save">Enregistrer</button><button class="btn block danger" data-a="sh-del">Supprimer ce tir</button>`;
  }
  if(o.k==='goal'){
    const used=db.goals.map(g=>g.scope);
    return `<div class="ph"><h2>${o.old?'Modifier l\'objectif':'Nouvel objectif'}</h2>${closeBtn()}</div>
    <div class="card"><label class="fld"><span>Catégorie</span><select data-c="gf" data-k="scope">${Object.keys(GSCOPE).map(k=>`<option value="${k}"${o.scope===k?' selected':''}>${GSCOPE[k]}${used.includes(k)&&k!==o.old?' (remplacer)':''}</option>`).join('')}</select></label>
    <label class="fld"><span>Pourcentage visé</span><input type="number" inputmode="numeric" min="1" max="100" data-c="gf" data-k="target" value="${esc(o.target)}" placeholder="Ex : 75"></label></div>
    <button class="btn pri block xl" data-a="g-save">Enregistrer</button>${o.old?`<button class="btn block danger" data-a="g-del">Supprimer l'objectif</button>`:''}`;
  }
  return '';
}
function renderSheets(){
  const c=$('#sheets');if(!c)return;
  const sc=[...c.querySelectorAll('.pn')].map(p=>p.scrollTop);
  c.innerHTML=ui.sheets.map(o=>`<div class="ov"><div class="bd" data-a="closesheet"></div><div class="pn" role="dialog" aria-modal="true">${sheetHTML(o)}</div></div>`).join('');
  [...c.querySelectorAll('.pn')].forEach((p,i)=>{p.scrollTop=sc[i]||0});
}
const openSheet=o=>{ui.sheets.push(o);renderSheets()};
const closeSheet=()=>{ui.sheets.pop();refresh()};

/* ========== Rendu principal ========== */
const TITLES={saisie:'Nouvelle session',histo:'Historique',stats:'Statistiques',obj:'Objectifs'};
function render(){
  const s=active(),live=ui.tab==='saisie'&&!!s;
  $('#hdr').hidden=live;$('#live').hidden=!live;$('#actions').hidden=!live;
  if(!live)$('#hdr').innerHTML=`<h1>${TITLES[ui.tab]}</h1><button class="btn ico" data-a="gear" aria-label="Réglages">⚙</button>`;
  else{
    const lv=$('#live');lv.innerHTML=liveBar(s);$('#actions').innerHTML=actionsBar(s);
    lv.className='';if(ui.flash){void lv.offsetWidth;lv.className='f-'+ui.flash}
    const d=$('#dots');if(d)d.scrollLeft=d.scrollWidth;
  }
  ui.flash=null;
  const main=$('#main'),st=main.scrollTop;
  main.innerHTML=ui.tab==='saisie'?(s?liveMain(s):startView()):ui.tab==='histo'?viewHisto():ui.tab==='stats'?viewStats():viewObj();
  main.scrollTop=ui.lastTab===ui.tab?st:0;ui.lastTab=ui.tab;
  document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('on',b.dataset.v===ui.tab);if(b.dataset.v===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(s&&s.status==='active')wake();else release();
}
function refresh(){render();renderSheets()}

/* ========== CSV ========== */
const CSVH=['ligne','session_id','type_session','date','adversaire','lieu','exercice','duree_min','note_session','type_tir_defaut','horodatage','resultat','type_tir','zone','situation','objectif_portee','objectif_cible'];
const csvCell=v=>{v=v==null?'':String(v);return /[;"\n\r,]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function buildCSV(){
  const rows=[CSVH];
  for(const s of db.sessions){
    const base=[s.id,s.kind==='match'?'Match':'Entraînement',s.date,s.opp,s.place,s.ex,durMinOf(s)==null?'':durMinOf(s),s.note,s.defType?TYPES[s.defType]:''];
    if(!s.shots.length)rows.push(['session',...base,'','','','','','','']);
    for(const h of s.shots)rows.push(['tir',...base,new Date(h.t).toISOString(),h.m?'Réussi':'Raté',h.ty?TYPES[h.ty]:'',h.z?ZONES[h.z]:'',h.s?SITS[h.s]:'','','']);
  }
  for(const g of db.goals)rows.push(['objectif','','','','','','','','','','','','','','',GSCOPE[g.scope],g.target]);
  return '\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
}
async function exportCSV(){
  if(!db.sessions.length&&!db.goals.length){toast('Rien à exporter pour le moment');return}
  const csv=buildCSV(),name='tirs-basket-'+todayISO()+'.csv';
  try{const file=new File([csv],name,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Mes tirs de basket'});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Fichier CSV exporté');
}
function parseCSV(t,d){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows;
}
const rev=map=>{const o={};for(const k in map)o[map[k].toLowerCase()]=k;return o};
function importCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/,1)[0],delim=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
  const rows=parseCSV(text,delim);if(rows.length<2)throw new Error('Fichier vide');
  const hdr=rows[0].map(x=>x.trim().toLowerCase()),ix={};hdr.forEach((h,i)=>ix[h]=i);
  if(ix.ligne==null)throw new Error('Format non reconnu (colonne « ligne » absente)');
  const get=(r,k)=>ix[k]==null?'':(r[ix[k]]||'').trim();
  const rT=rev(TYPES),rZ=rev(ZONES),rS=rev(SITS),rG=rev(GSCOPE);
  const pickT=v=>{v=v.toLowerCase();return rT[v]||(TYPES[v]?v:null)};
  const map=new Map();let nShots=0,nGoals=0;
  for(const r of rows.slice(1)){
    const kind=get(r,'ligne').toLowerCase();
    if(kind==='objectif'){
      const sc=rG[get(r,'objectif_portee').toLowerCase()]||(GSCOPE[get(r,'objectif_portee')]?get(r,'objectif_portee'):null),tg=parseInt(get(r,'objectif_cible'),10);
      if(sc&&tg>0&&tg<=100){db.goals=db.goals.filter(g=>g.scope!==sc);db.goals.push({scope:sc,target:tg});nGoals++}
      continue;
    }
    if(kind!=='tir'&&kind!=='session')continue;
    const sid=get(r,'session_id')||('imp-'+get(r,'date')+'-'+get(r,'exercice')+get(r,'adversaire'));
    let s=map.get(sid);
    if(!s){const d=get(r,'date'),dm=parseInt(get(r,'duree_min'),10);
      s={id:sid.startsWith('imp-')?uid():sid,kind:/match/i.test(get(r,'type_session'))?'match':'training',date:/^\d{4}-\d{2}-\d{2}$/.test(d)?d:todayISO(),createdAt:Date.now()+map.size,
        opp:get(r,'adversaire'),place:get(r,'lieu'),ex:get(r,'exercice'),durMin:dm>0?dm:null,note:r[ix.note_session]||'',defType:pickT(get(r,'type_tir_defaut')),
        status:'done',elapsed:(dm>0?dm:0)*60000,segStart:null,lastTick:0,shots:[]};
      map.set(sid,s)}
    if(kind==='tir'){
      const res=get(r,'resultat'),ts=Date.parse(get(r,'horodatage'));
      s.shots.push({t:isNaN(ts)?Date.now():ts,m:/ussi/i.test(res)||res==='1'?1:0,ty:pickT(get(r,'type_tir')),z:rZ[get(r,'zone').toLowerCase()]||(ZONES[get(r,'zone')]?get(r,'zone'):null),s:rS[get(r,'situation').toLowerCase()]||null});nShots++;
    }
  }
  let nS=0;
  for(const s of map.values()){
    if(s.id===db.activeId)continue;
    s.shots.sort((a,b)=>a.t-b.t);
    db.sessions=db.sessions.filter(x=>x.id!==s.id);db.sessions.push(s);nS++;
  }
  save();
  return{nS,nShots,nGoals};
}

/* ========== Actions (clics) ========== */
const A={
  tab(el){ui.tab=el.dataset.v;refresh()},
  gear(){openSheet({k:'settings'})},
  kind(el){ui.form.kind=el.dataset.v;refresh()},
  start(){startSession()},
  shot(el){addShot(el.dataset.m==='1')},
  undo(){undoShot()},pause(){pauseS()},resume(){resumeS()},finish(){finishS()},
  'pick-type'(el){applyType(db.sel,el.dataset.v,false);save();refresh()},
  'pick-zone'(el){applyZone(db.sel,el.dataset.z);save();refresh()},
  'pick-sit'(el){db.sel.s=db.sel.s===el.dataset.v?null:el.dataset.v;save();refresh()},
  dot(el){const s=active();if(!s)return;const i=+el.dataset.i;if(s.shots[i])openSheet({k:'shot',sid:s.id,i,d:Object.assign({},s.shots[i])})},
  opensess(el){openSheet({k:'sess',id:el.dataset.id})},
  closesheet(){closeSheet()},
  gosaisie(){ui.sheets=[];ui.tab='saisie';refresh()},
  shotedit(el){const s=sessById(el.dataset.sid),i=+el.dataset.i;if(s&&s.shots[i])openSheet({k:'shot',sid:s.id,i,d:Object.assign({},s.shots[i])})},
  'sh-res'(el){topSheet().d.m=+el.dataset.v;renderSheets()},
  'sh-type'(el){applyType(topSheet().d,el.dataset.v,true);renderSheets()},
  'sh-zone'(el){applyZone(topSheet().d,el.dataset.z);renderSheets()},
  'sh-sit'(el){const d=topSheet().d;d.s=d.s===el.dataset.v?null:el.dataset.v;renderSheets()},
  'sh-save'(){const o=topSheet(),s=sessById(o.sid);if(s&&s.shots[o.i]){Object.assign(s.shots[o.i],{m:o.d.m,ty:o.d.ty,z:o.d.z,s:o.d.s});save();toast('Tir modifié ✓')}closeSheet()},
  'sh-del'(){const o=topSheet(),s=sessById(o.sid);if(!confirm('Supprimer ce tir ?'))return;if(s){s.shots.splice(o.i,1);save()}closeSheet()},
  addshot(el){const s=sessById(el.dataset.id);if(!s)return;const ty=s.defType||null;s.shots.push({t:Date.now(),m:+el.dataset.m,ty,z:ty==='ft'?'ft':null,s:null});save();buzz(20);refresh()},
  skind(el){const s=sessById(el.dataset.id);if(!s)return;s.kind=el.dataset.v;save();refresh()},
  reopen(el){const s=sessById(el.dataset.id);if(!s||active())return;s.status='active';s.segStart=Date.now();s.lastTick=Date.now();db.activeId=s.id;save();ui.sheets=[];ui.tab='saisie';refresh()},
  delsess(el){const s=sessById(el.dataset.id);if(!s)return;if(!confirm('Supprimer définitivement cette session et ses '+s.shots.length+' tirs ?'))return;
    db.sessions=db.sessions.filter(x=>x!==s);if(db.activeId===s.id){db.activeId=null;release()}save();ui.sheets=ui.sheets.filter(o=>!(o.k==='sess'&&o.id===s.id));refresh();toast('Session supprimée')},
  stf(el){ui.st[el.dataset.k]=el.dataset.v;refresh()},
  range(el){ui.st.range=el.dataset.v;refresh()},
  addgoal(){openSheet({k:'goal',old:null,scope:'ft',target:''})},
  editgoal(el){const g=db.goals.find(x=>x.scope===el.dataset.scope);if(g)openSheet({k:'goal',old:g.scope,scope:g.scope,target:g.target})},
  'g-save'(){const o=topSheet(),t=parseInt(o.target,10);if(!(t>=1&&t<=100)){toast('Entrez un pourcentage entre 1 et 100');return}
    db.goals=db.goals.filter(g=>g.scope!==o.scope&&g.scope!==o.old);db.goals.push({scope:o.scope,target:t});save();closeSheet();toast('Objectif enregistré ✓')},
  'g-del'(){const o=topSheet();if(!confirm('Supprimer cet objectif ?'))return;db.goals=db.goals.filter(g=>g.scope!==o.old);save();closeSheet()},
  export(){exportCSV()},
  import(){$('#fi').click()},
  wipe(){if(!confirm('Effacer TOUTES les sessions, tirs et objectifs de cet appareil ?'))return;if(!confirm('Dernière confirmation : cette action est irréversible.'))return;
    db=defDB();save();release();ui.sheets=[];refresh();toast('Données effacées')}
};
const C={
  set(el){const k=el.dataset.k;db.settings[k]=!!el.checked;fixSel();save();refresh()},
  form(el){ui.form[el.dataset.k]=el.value;if(el.dataset.k==='date')ui.form.dt=1},
  sf(el){const s=sessById(el.dataset.id);if(!s)return;const k=el.dataset.k;let v=el.value;
    if(k==='date'&&!v)return;
    if(k==='durMin')v=v===''?null:Math.max(1,parseInt(v,10)||1);
    if(k==='defType')v=v||null;
    s[k]=v;save()},
  gf(el){const o=topSheet();if(!o)return;o[el.dataset.k]=el.value}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el,e)});
const onChange=e=>{const el=e.target.closest&&e.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el,e)};
document.addEventListener('input',onChange);document.addEventListener('change',onChange);
$('#fi').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const res=importCSV(String(r.result));refresh();toast(res.nS+' session(s), '+res.nShots+' tir(s)'+(res.nGoals?', '+res.nGoals+' objectif(s)':'')+' importé(s) ✓')}catch(err){toast('Import impossible : '+err.message)}};
  r.onerror=()=>toast('Lecture du fichier impossible');
  r.readAsText(file);e.target.value='';
});

/* ========== Chronomètre ========== */
let lastSave=Date.now();
setInterval(()=>{const s=active();if(!s)return;const tm=$('#tm');if(tm)tm.textContent=fmtDur(elapsedMs(s));
  if(s.status==='active'&&Date.now()-lastSave>15000){s.lastTick=Date.now();save();lastSave=Date.now()}},1000);

/* ========== PWA ========== */
(function(){
  try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    x.fillStyle='#0a0f16';x.fillRect(0,0,180,180);x.fillStyle='#f97316';x.beginPath();x.arc(90,90,58,0,7);x.fill();
    x.save();x.beginPath();x.arc(90,90,58,0,7);x.clip();x.strokeStyle='#1a1008';x.lineWidth=5;
    x.beginPath();x.moveTo(90,30);x.lineTo(90,150);x.moveTo(30,90);x.lineTo(150,90);x.stroke();
    x.beginPath();x.arc(90+93,90,58,0,7);x.stroke();x.beginPath();x.arc(90-93,90,58,0,7);x.stroke();x.restore();
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);}catch(e){}
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();

render();
</script>
